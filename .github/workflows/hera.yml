# Hera: i collaudi della città li fa lei (JJ, 5 ottobre 2026: «tu non devi fare il collaudo, deve farli Hera,
# scrivigli i file di collaudo dentro, è inutile che stai attiva mezz'ora ad aspettare»).
#
# Athena spinge sul ramo «prova». Hera fa girare collaudo/insieme.py, collaudo/conto.py e collaudo/citta.py (~30 min, SwiftShader).
# Solo se sono VERDI porta «prova» su main — avanti veloce, mai sovrascrivendo: se main nel frattempo è andato
# avanti, si ferma e lo dice — e chiede a GitHub Pages di ripubblicare. Rosso: main non si tocca, arriva la mail
# di fallimento, e i registri restano negli artefatti della corsa. Repository pubblico: i minuti non si pagano.
name: Hera

on:
  push:
    branches: [prova]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write   # 28/10: cancellare la copia del sito (DELETE actions/artifacts) vuole «Actions» in scrittura

concurrency:
  group: hera
  cancel-in-progress: false

jobs:
  collaudo:
    runs-on: ubuntu-24.04   # 5/10: con ubuntu-latest le macchine non arrivavano (annullate dopo 15 min)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: il browser
        run: |
          pip install --quiet playwright==1.56.0 pillow   # pillow: il collaudo della città guarda i colori delle foto
          python -m playwright install --with-deps chromium

      - name: la città insieme (collaudo/insieme.py)
        run: |
          # niente pipefail: se il collaudo cade, Hera deve arrivare a dire PERCHÉ (i registri da fuori non si leggono)
          python -u collaudo/insieme.py citta.html > insieme.log 2>&1 || true   # mai fermarsi qui: l'annotazione sotto deve dire PERCHÉ
          cat insieme.log
          if ! tail -1 insieme.log | grep -qx VERDE; then
            NO=$(grep -E '^  (NO|❌)' insieme.log | head -3 | tr '\n' '|')
            echo "::error::Hera: la città insieme è ROSSA — ${NO:-nessuna prova rossa: è caduto. Ultime righe: $(tail -6 insieme.log | tr '\n' '|' | cut -c1-900)}"; exit 1; fi
          echo "::notice::Hera: città insieme $(tail -2 insieme.log | head -1)"

      - name: l'account (collaudo/conto.py)
        run: |
          python -u collaudo/conto.py citta.html > conto.log 2>&1 || true   # mai fermarsi qui: l'annotazione sotto deve dire PERCHÉ
          cat conto.log
          if ! tail -1 conto.log | grep -qx VERDE; then
            NO=$(grep -E '^  (NO|❌)' conto.log | head -3 | tr '\n' '|')
            echo "::error::Hera: l'account è ROSSO — ${NO:-nessuna prova rossa: è caduto. Ultime righe: $(tail -6 conto.log | tr '\n' '|' | cut -c1-900)}"; exit 1; fi
          echo "::notice::Hera: account $(tail -2 conto.log | head -1)"

      - name: la pagina (primo, nato, conversazioni, schede, vita)
        run: |
          # 23/10, JJ: «Hera deve collaudare tutto»: queste quattro esistevano ma giravano solo a mano. ~3 minuti.
          ROSSE=""
          # 28/10: anche vita.py (la vita prima del lavoro, 27/10): girava solo a mano, e le prove del 28/10 nessuno le aveva viste girare
          for f in primo nato conversazioni schede vita; do
            ESCE=0; python -u collaudo/$f.py index.html > $f.log 2>&1 || ESCE=$?   # bash -e: senza «||» il primo rosso chiude il passo muto
            echo "── $f (esce $ESCE)"; cat $f.log
            if [ $ESCE -ne 0 ] || ! tail -1 $f.log | grep -qx VERDE; then
              ROSSE="$ROSSE $f: $(grep -E '^  (NO|❌)' $f.log | head -2 | tr '\n' '|' | cut -c1-300)(esce $ESCE)|"; fi
          done
          if [ -n "$ROSSE" ]; then echo "::error::Hera: la pagina è ROSSA —$ROSSE"; exit 1; fi
          echo "::notice::Hera: pagina VERDE (primo, nato, conversazioni, schede, vita)"

      - name: la città (collaudo/citta.py)
        run: |
          # niente pipefail: se il collaudo cade, Hera deve arrivare a dire PERCHÉ (i registri da fuori non si leggono)
          python -u collaudo/citta.py citta.html > citta.log 2>&1 || true   # mai fermarsi qui: l'annotazione sotto deve dire PERCHÉ
          cat citta.log
          if ! tail -1 citta.log | grep -qx VERDE; then
            NO=$(grep -E '^  (NO|❌)' citta.log | head -3 | tr '\n' '|')
            # 19/10: «è caduto» con le sole righe di playwright non dice DOVE; il registro intero non si scarica da qui
            DOVE=$(grep -o 'collaudo/citta.py", line [0-9]*' citta.log | tail -1)
            PRIMA=$(grep -B1 -m1 '^Traceback' citta.log | head -1 | cut -c1-200)
            echo "::error::Hera: la città è ROSSA — ${NO:-nessuna prova rossa: è caduto in ${DOVE:-?}, dopo «${PRIMA}». Ultime righe: $(tail -3 citta.log | tr '\n' '|' | cut -c1-600)}"; exit 1; fi
          echo "::notice::Hera: città $(tail -2 citta.log | head -1)"

      - name: verde → main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::Hera: main è andato avanti mentre collaudavo: «prova» va rifatto sopra main, non lo sovrascrivo"; exit 1; fi
          git push origin HEAD:main
          echo "::notice::Hera: VERDE, $(git rev-parse --short HEAD) è su main"

      - name: GitHub Pages ripubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          [ "$R" = "201" ] && echo "::notice::Hera: pubblicazione chiesta a GitHub Pages" || echo "::warning::Hera: GitHub Pages ha risposto $R alla richiesta di pubblicare: se la pagina non cambia, un push qualunque su main la ripubblica"

      - name: cancella la copia del sito
        # 28/10: lo spazio delle Actions era al 91% (338,77 GB-ora su circa 372); ogni pubblicazione lascia un «github-pages» da ~35 MB per un giorno.
        # Aspetta «built» per questo commit (max 5 min) e poi lo cancella; se non arriva o una chiamata cade lo scrive e va avanti: mai una mail rossa per questo.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 collaudo/cancella_copia.py "$(git rev-parse HEAD)"

      - name: i registri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registri-hera
          path: "*.log"
          if-no-files-found: ignore
      # Hera nell'Olimpo (24/10): l'esito di questa consegna, verde o rosso, nel suo argomento.
      # Non ferma niente: se l'Olimpo non risponde, la consegna resta com'era.
      - name: Hera nell'Olimpo
        if: always()
        continue-on-error: true
        env:
          OLIMPO_CHIAVE: ${{ secrets.OLIMPO_CHIAVE }}
          ESITO: ${{ job.status }}
          MSG: ${{ github.event.head_commit.message }}
          COSA: "la pagina e la città"
        run: |
          if [ -z "$OLIMPO_CHIAVE" ]; then echo "::notice::niente OLIMPO_CHIAVE: l'Olimpo non lo sa"; exit 0; fi
          if [ "$ESITO" = success ]; then E="✅ $COSA: verde"; else E="🔴 $COSA: ROSSA ($ESITO)"; fi
          RIGA=$(printf '%s' "${MSG:-a mano}" | head -1 | cut -c1-160)
          T=$(printf '%s · %s\n«%s»' "$E" "${GITHUB_SHA:0:7}" "$RIGA")
          [ "$ESITO" = success ] || T=$(printf '%s\n%s/%s/actions/runs/%s' "$T" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          T="$T" python3 -c 'import json,os; print(json.dumps({"dio": "hera", "testo": os.environ["T"]}))' | curl -s -m 15 -o /tmp/olimpo.txt -w "olimpo %{http_code}\n" -X POST \
            https://jjavis-porta.19-jjardito93.workers.dev/olimpo -H "content-type: application/json" -H "X-Chiave: $OLIMPO_CHIAVE" --data @- || true
          cat /tmp/olimpo.txt 2>/dev/null; echo
