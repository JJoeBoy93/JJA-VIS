<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>La città di JJA-VIS</title>
<meta name="description" content="Entra nella città di JJA-VIS: la reception, la bottega coi prodotti già pronti, la sartoria per vestire il tuo avatar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Mono&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Il tema di JARVIS, lo stesso della pagina (index.html) */
:root{
  --bg:#020B18; --panel:#030E1E; --bordo:#0D3A5C; --accento:#00B4D8; --accento2:#0077B6;
  --testo:#CAF0F8; --tenue:#48CAE4; --oro:#FFD60A; --input:#020D1A;
  --f-titoli:"Archivo",system-ui,sans-serif; --f-testo:"DM Sans",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020B18}}
:root[data-theme="dark"]{--bg:#020B18}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--testo);font:500 16px/1.4 var(--f-testo);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scena{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
a{color:var(--accento)}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

.cornice{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bordo);position:relative}
.cornice::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--accento);border-left:2px solid var(--accento)}
.cornice::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--accento);border-right:2px solid var(--accento)}

/* in alto: il nome della città, i numeri veri, il giro */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.hud>*{pointer-events:auto}
#cartello{padding:9px 13px 10px;max-width:calc(100% - 110px)}
.titolo{font:800 19px/1.1 var(--f-titoli);letter-spacing:.03em;text-shadow:0 0 14px color-mix(in srgb,var(--accento) 50%,transparent)}
.sotto{font:400 12px/1.35 var(--f-mono);color:var(--tenue);margin-top:4px}
.sotto b{color:var(--oro);font-weight:400}
#giro{margin-top:8px;display:flex;align-items:center;gap:7px;font:500 13px/1.2 var(--f-testo);color:var(--testo);background:none;border:0;padding:0;cursor:pointer;text-align:left}
#giro .f{width:11px;height:11px;border:2px solid var(--accento);border-radius:50%;flex:none}
#giro .f.fatta{background:var(--accento);box-shadow:0 0 8px var(--accento)}
.pulsante{font:700 14px/1 var(--f-testo);color:var(--testo);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bordo);
  padding:11px 13px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pulsante:active{border-color:var(--accento)}

/* in basso: joystick, Vai a…, Entra */
#joy{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:124px;height:124px;border-radius:50%;z-index:6;
  background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--bordo);touch-action:none}
#pomo{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:color-mix(in srgb,var(--testo) 85%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accento) 60%,transparent)}
#vai{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);z-index:6;padding:14px 16px;font-size:16px}
#entra{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);z-index:6;
  font:800 18px/1 var(--f-titoli);letter-spacing:.02em;color:var(--bg);background:var(--accento);border:0;padding:15px 22px;cursor:pointer;
  box-shadow:0 0 22px color-mix(in srgb,var(--accento) 60%,transparent);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#entra[hidden]{display:none}
#aiuto{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);z-index:5;
  font:400 13px/1.35 var(--f-mono);color:var(--tenue);text-align:center;padding:8px 12px;max-width:300px;pointer-events:none;transition:opacity .6s}

/* il foglio che sale dal basso quando entri */
#foglio{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px);border-bottom:0;transform:translateY(105%);transition:transform .32s ease-out;
  -webkit-user-select:text;user-select:text;touch-action:pan-y}
#foglio.aperto{transform:none}
#foglio:not(.aperto){pointer-events:none}
body.con-foglio .hud,body.con-foglio #joy,body.con-foglio #vai{opacity:0;pointer-events:none}
.hud,#joy,#vai{transition:opacity .25s}
body.in-sartoria #foglio{max-height:56vh} /* sopra si deve vedere l'avatar intero */ /* mentre scende non deve rubare il tocco al cerchio */
@media (prefers-reduced-motion:reduce){#foglio{transition:none}}
#foglio .dentro{max-width:560px;margin:0 auto}
#foglio h2{font:800 28px/1.05 var(--f-titoli);margin:0 32px 6px 0}
#foglio .eti{font:400 12px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);margin:0 0 6px}
#foglio p{margin:0 0 12px;font-size:17px;line-height:1.45}
#foglio .piccolo{font-size:14px;color:var(--tenue)}
#chiudi{position:absolute;top:10px;right:10px;width:42px;height:42px;font:400 26px/1 var(--f-testo);color:var(--testo);background:none;border:1px solid var(--bordo);cursor:pointer}
.azioni{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.vai-pagina{font:700 16px/1 var(--f-testo);color:var(--bg);background:var(--accento);border:0;padding:13px 16px;text-decoration:none;display:inline-block}
.vai-pagina.seconda{background:none;color:var(--testo);border:1px solid var(--bordo)}
.prodotto{border:1px solid var(--bordo);padding:12px 13px;margin:0 0 10px;background:color-mix(in srgb,var(--accento) 4%,transparent)}
.prodotto h3{font:800 20px/1.1 var(--f-titoli);margin:0 0 6px}
.prodotto p{font-size:15px!important;margin:0 0 10px!important}
.prodotto.tuo{border-color:var(--oro);box-shadow:0 0 14px color-mix(in srgb,var(--oro) 25%,transparent) inset}
.badge{display:inline-block;font:400 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--bg);background:var(--oro);padding:4px 6px;margin:0 0 7px}
.sezione{font:700 15px/1.2 var(--f-testo);margin:16px 0 8px;color:var(--testo)}
.scelte{display:flex;flex-wrap:wrap;gap:7px}
.scelta{font:600 15px/1 var(--f-testo);padding:10px 12px;border:1px solid var(--bordo);background:color-mix(in srgb,var(--accento) 5%,transparent);color:var(--testo);cursor:pointer}
.scelta[aria-pressed="true"]{background:#0D2A3E;border-color:var(--accento);box-shadow:0 0 10px color-mix(in srgb,var(--accento) 35%,transparent) inset}
.tinte{display:flex;flex-wrap:wrap;gap:9px}
.tinta{width:38px;height:38px;border:2px solid var(--bordo);cursor:pointer;padding:0}
.tinta[aria-pressed="true"]{border-color:var(--oro);box-shadow:0 0 0 2px var(--bg) inset}
.tinta.originale{background:repeating-linear-gradient(45deg,#0D3A5C 0 6px,#030E1E 6px 12px)}
.elenco-vai button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;font:600 17px/1.2 var(--f-testo);color:var(--testo);
  background:none;border:0;border-bottom:1px solid var(--bordo);padding:13px 4px;cursor:pointer}
.elenco-vai small{display:block;font:400 13px/1.3 var(--f-mono);color:var(--tenue);margin-top:3px}
.elenco-vai .ic{font-size:22px;width:30px;text-align:center;flex:none}

/* l'ingresso */
#carica{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse 70% 50% at 50% 45%,#06223a,var(--bg));transition:opacity .5s}
#carica.via{opacity:0;pointer-events:none}
.sfera{width:120px;height:120px;border-radius:50%;border:2px solid var(--accento);
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--accento) 45%,transparent),transparent 60%);
  box-shadow:0 0 40px color-mix(in srgb,var(--accento) 45%,transparent),inset 0 0 30px color-mix(in srgb,var(--accento) 35%,transparent);
  animation:batte 1.6s ease-in-out infinite}
@keyframes batte{50%{transform:scale(1.06);box-shadow:0 0 60px color-mix(in srgb,var(--accento) 65%,transparent),inset 0 0 30px color-mix(in srgb,var(--accento) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.sfera{animation:none}}
#carica .titolo{font-size:26px}
.barra{width:220px;height:6px;background:var(--bordo);overflow:hidden}
.barra i{display:block;height:100%;width:30%;background:var(--accento);animation:scorre 1.2s linear infinite}
@keyframes scorre{from{transform:translateX(-100%)}to{transform:translateX(340%)}}

/* senza 3D: la città diventa un elenco, e funziona lo stesso */
#riserva{position:fixed;inset:0;z-index:25;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 40px;background:var(--bg);-webkit-user-select:text;user-select:text}
#riserva[hidden]{display:none}
#riserva .dentro{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<canvas id="scena" aria-label="La città di JJA-VIS in 3D: muoviti col cerchio in basso a sinistra, trascina per guardarti intorno"></canvas>

<div class="hud">
  <div id="cartello" class="cornice">
    <div class="titolo">La città di JJA-VIS</div>
    <div class="sotto" id="numeri">il tuo assistente, in carne e palazzi</div>
    <button id="giro" type="button" aria-label="Il tuo primo giro"></button>
  </div>
  <a class="pulsante" href="index.html" id="esci">← La pagina</a>
</div>

<div id="joy" aria-hidden="true"><div id="pomo"></div></div>
<button id="vai" class="pulsante" type="button">☰ Vai a…</button>
<button id="entra" type="button" hidden></button>
<div id="aiuto" class="cornice">Muoviti col cerchio · trascina per guardarti intorno · tocca un palazzo per andarci</div>

<section id="foglio" class="cornice" role="dialog" aria-modal="false" aria-labelledby="foglio-titolo" aria-hidden="true">
  <button id="chiudi" type="button" aria-label="Chiudi">×</button>
  <div class="dentro" id="foglio-dentro"></div>
</section>

<div id="carica" role="status" aria-live="polite">
  <div class="sfera"></div>
  <div class="titolo">Accendo la città…</div>
  <div class="barra"><i></i></div>
</div>

<div id="riserva" hidden>
  <div class="dentro">
    <div class="titolo" style="font-size:28px">La città di JJA-VIS</div>
    <p class="sotto" id="riserva-perche" style="font-size:14px;margin:8px 0 18px"></p>
    <div class="elenco-vai" id="riserva-elenco"></div>
    <p style="margin-top:22px"><a class="pulsante" href="index.html">← Torna alla pagina</a></p>
  </div>
</div>

<script type="module">
import * as THREE from "./lib/three.module.min.js";

// ══ LA CITTÀ DI JJA-VIS ══ — nata il 2 ottobre 2026 (Athena), su richiesta di JJ:
// «non voglio la piazzetta, voglio una piccola città: la reception, la bottega
// con i prodotti già fatti, e tutti gli elementi inerenti». Più la Sartoria:
// «una skin per ogni professione… ma non devono per forza vestirsi come il lavoro».
// Ogni palazzo porta alla scheda che esiste già in index.html: qui non si
// duplica nessun modulo, si cammina fino alla porta giusta.

const $=id=>document.getElementById(id);
const PAGINA="index.html";
const PORTA="https://jjavis-porta.19-jjardito93.workers.dev";

// Il profilo della pagina (nome dell'assistente, mestiere): lo si LEGGE soltanto.
let io={}; try{ io=JSON.parse(localStorage.getItem("jjavis-io")||"{}")||{}; }catch(_){ io={}; }
// Quello della città sta in una chiave sua, in questo telefono e basta.
const CHIAVE="jjavis-citta";
let citta={}; try{ citta=JSON.parse(localStorage.getItem(CHIAVE)||"{}")||{}; }catch(_){ citta={}; }
const salva=()=>{ try{ localStorage.setItem(CHIAVE, JSON.stringify(citta)); }catch(_){} };
if(!citta.giro) citta.giro={};
if(!citta.mestiere && io.mestiere) citta.mestiere=io.mestiere;

// ── i mestieri (gli stessi della pagina) e i vestiti ──
const MESTIERI=[["Corriere o autista","corriere"],["Negozio o commercio","negozio"],["Artigiano o tecnico","artigiano"],
  ["Sanità","sanita"],["Ufficio","ufficio"],["Studio","studio"],["Guida turistica","guida"],["Creator o gamer","creator"],["Altro","altro"]];
const VESTITI={
  corriere: {nome:"Corriere",   maglia:0x2f5d8c, pantaloni:0x1d2735, scarpe:0x111111},
  negozio:  {nome:"Bottega",    maglia:0xf2f2f2, pantaloni:0x2b2f38, scarpe:0x3b2a1e},
  artigiano:{nome:"Cantiere",   maglia:0xe07a1f, pantaloni:0xe07a1f, scarpe:0x3b2a1e},
  sanita:   {nome:"Camice",     maglia:0xf7f7f7, pantaloni:0x5fb3b3, scarpe:0xeeeeee},
  ufficio:  {nome:"Giacca e cravatta", maglia:0x2a2f3a, pantaloni:0x2a2f3a, scarpe:0x111111},
  studio:   {nome:"Felpa e zaino", maglia:0x6a4fb5, pantaloni:0x34507a, scarpe:0xdddddd},
  guida:    {nome:"Guida",      maglia:0xc8392f, pantaloni:0xcbb48a, scarpe:0x3b2a1e},
  creator:  {nome:"Creator",    maglia:0x15161a, pantaloni:0x15161a, scarpe:0xf2f2f2},
  altro:    {nome:"Il mio stile", maglia:0x3aa0a8, pantaloni:0x34507a, scarpe:0xf2f2f2},
  jjavis:   {nome:"JJA-VIS",    maglia:0x0a1a2e, pantaloni:0x0a1a2e, scarpe:0x0a1a2e},
};
const PELLI=[0xf1d0b5,0xe0b48f,0xc68b5e,0x8d5a3b,0x5a3825];
const TINTE=[null,0x00B4D8,0xE63946,0xFFD60A,0x2ECC71,0x8E44AD,0xF5F5F5,0x1B1B1B];
const vestitoDi=m=>{ const t=MESTIERI.find(x=>x[0]===m); return t?t[1]:"altro"; };
if(!citta.vestito) citta.vestito=citta.mestiere?vestitoDi(citta.mestiere):"altro";
if(typeof citta.pelle!=="number") citta.pelle=1;

// ── la Bottega: quello che c'è davvero nella scheda Bottega della pagina ──
const PRODOTTI={
  clio:{titolo:"Clio",eti:"Già pronto · per le guide turistiche",testo:"Parli una volta sola, nella tua lingua: ogni visitatore ti legge nella sua, sul suo telefono, mentre parli. Si entra con un invito personale.",link:PAGINA+"#clio",azione:"Chiedi l'invito"},
  sopralluogo:{titolo:"Sopralluogo",eti:"Gratis · per chi ha un'attività",testo:"Lasciami il link del tuo sito o del tuo profilo: ti scrivo per mail cosa funziona, cosa no e da dove partirei.",link:PAGINA+"#sopralluogo",azione:"Fammi il sopralluogo"},
  sumisura:{titolo:"Su misura",eti:"Su commissione, adesso",testo:"Pagine e siti per la tua attività, piccoli strumenti web (calcolatori, preventivi, listini, prenotazioni), bot Telegram, isole di Fortnite.",link:PAGINA+"#costruisci",azione:"Chiedi un preventivo"},
  athena:{titolo:"Il sito di Athena Trasporti",eti:"Già fatto",testo:"Una ditta di trasporti appena nata, a Limbiate: cinque schede comode dal telefono, il furgone che percorre la strada, il preventivo che parte su WhatsApp.",link:"https://jjoeboy93.github.io/athena-trasporti/",azione:"Guardalo",fuori:true},
};
const ORDINE={guida:["clio","sopralluogo","sumisura","athena"], corriere:["athena","sumisura","sopralluogo","clio"],
  creator:["sumisura","sopralluogo","athena","clio"]};
const PER_TE={guida:"clio"};

// ── il primo giro: tre fermate, come un giro di consegne ──
const FERMATE=[["sartoria","Sartoria"],["reception","Reception"],["bottega","Bottega"]];
function disegnaGiro(){
  const g=$("giro"); g.textContent="";
  const fatte=FERMATE.filter(f=>citta.giro[f[0]]).length;
  if(fatte===FERMATE.length){
    if(citta.giroVisto){ g.hidden=true; return; }
    g.append("✓ Giro chiuso: ora sai dove trovare tutto"); return;
  }
  FERMATE.forEach(f=>{ const d=document.createElement("span"); d.className="f"+(citta.giro[f[0]]?" fatta":""); g.appendChild(d); });
  const prossima=FERMATE.find(f=>!citta.giro[f[0]]);
  g.append(` Il tuo primo giro · prossima: ${prossima[1]}`);
  g.dataset.prossima=prossima[0];
}
function segnaFermata(id){
  if(!FERMATE.some(f=>f[0]===id) || citta.giro[id]) return;
  citta.giro[id]=true; salva(); disegnaGiro();
}

// ══ IL FOGLIO: cosa c'è dentro ogni palazzo ══
function el(tag, attr={}, ...figli){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attr)){ if(k==="class") e.className=v; else if(k==="testo") e.textContent=v; else e.setAttribute(k,v); }
  figli.forEach(f=>{ if(f!=null) e.append(f); }); return e;
}
const vai=(href,testo,seconda,fuori)=>{ const a=el("a",{class:"vai-pagina"+(seconda?" seconda":""),href,testo}); if(fuori){ a.target="_blank"; a.rel="noopener"; } return a; };
const nomeAssistente=()=>(typeof io.nome==="string" && io.nome.trim()) ? io.nome.trim().slice(0,24) : "";

const LUOGHI={
  reception:{nome:"Reception",ic:"🛎",breve:"dai un nome al tuo assistente",foglio(){
    const n=nomeAssistente();
    if(n) return [el("h2",{id:"foglio-titolo",testo:"Reception"}),
      el("p",{testo:`Bentornato in città. ${n} ti aspetta alla pagina: lì gli parli, e ti risponde.`}),
      el("div",{class:"azioni"}, vai(PAGINA+"#inizia",`Parla con ${n}`)),
      el("p",{class:"piccolo",testo:"Il tuo avatar e il tuo vestito restano in questo telefono: non li mando a nessuno."})];
    return [el("h2",{id:"foglio-titolo",testo:"Reception"}),
      el("p",{testo:"Benvenuto in città. Qui nasce il tuo assistente: gli dai un nome, scegli come appare, e ti fa qualche domanda sul tuo lavoro per capire cosa costruirti."}),
      el("div",{class:"azioni"}, vai(PAGINA+"#inizia","Dai un nome al tuo assistente")),
      el("p",{class:"piccolo",testo:"Il tuo avatar e il tuo vestito restano in questo telefono: non li mando a nessuno."})];
  }},
  sartoria:{nome:"Sartoria",ic:"🧵",breve:"vesti il tuo avatar",foglio(){ return sartoria(); }},
  bottega:{nome:"Bottega",ic:"🛍",breve:"quello che puoi avere già adesso",foglio(){
    const v=VESTITI[vestitoDi(citta.mestiere)]?vestitoDi(citta.mestiere):"";
    const ordine=ORDINE[v]||["sopralluogo","sumisura","athena","clio"];
    const out=[el("p",{class:"eti",testo:"I prodotti di JJA-VIS"}), el("h2",{id:"foglio-titolo",testo:"Bottega"}),
      el("p",{testo:"Quello che puoi avere già adesso, senza aspettare l'app. Man mano che le mie funzioni diventano pronte per tutti, arrivano qui."})];
    ordine.forEach(k=>{ const p=PRODOTTI[k]; const tuo=PER_TE[v]===k;
      out.push(el("div",{class:"prodotto"+(tuo?" tuo":"")}, tuo?el("span",{class:"badge",testo:"PER IL TUO MESTIERE"}):null,
        el("p",{class:"eti",testo:p.eti}), el("h3",{testo:p.titolo}), el("p",{testo:p.testo}), vai(p.link,p.azione,false,p.fuori))); });
    return out;
  }},
  forgia:{nome:"La Forgia",ic:"🔨",breve:"costruiscimi qualcosa su misura",foglio(){ return [
    el("p",{class:"eti",testo:"Su commissione, adesso"}), el("h2",{id:"foglio-titolo",testo:"La Forgia"}),
    el("p",{testo:"Qui si lavora su misura, senza aspettare l'app: pagine e siti per la tua attività, piccoli strumenti web come calcolatori, preventivi, listini e prenotazioni, bot Telegram che rispondono ai tuoi clienti, isole di Fortnite."}),
    el("div",{class:"azioni"}, vai(PAGINA+"#costruisci","Chiedi un preventivo"), vai(PRODOTTI.athena.link,"Un lavoro già fatto",true,true))]; }},
  torre:{nome:"La Torre",ic:"🌐",breve:"chi sono e cosa so fare",foglio(){ return [
    el("h2",{id:"foglio-titolo",testo:"La Torre"}),

// La Sartoria: il mestiere serve a me, il vestito è tuo.
function sartoria(){
  const out=[el("p",{class:"eti",testo:"Il tuo avatar"}), el("h2",{id:"foglio-titolo",testo:"Sartoria"}),
    el("p",{testo:"Dimmi che lavoro fai: serve a me, per capire cosa costruirti. Poi vestiti come vuoi: non deve per forza essere la divisa del tuo lavoro."})];
  const mest=el("div",{class:"scelte",role:"group","aria-label":"Che lavoro fai"});
  MESTIERI.forEach(([m])=>{ const b=el("button",{class:"scelta",type:"button","aria-pressed":String(citta.mestiere===m),testo:m});
    b.addEventListener("click",()=>{ citta.mestiere=m; if(!citta.vestitoScelto) citta.vestito=vestitoDi(m); salva(); rivesti(); apriFoglio("sartoria",true); });
    mest.appendChild(b); });
  out.push(el("div",{class:"sezione",testo:"Che lavoro fai?"}), mest);
  const vest=el("div",{class:"scelte",role:"group","aria-label":"Come ti vesti"});
  Object.entries(VESTITI).forEach(([k,v])=>{ const b=el("button",{class:"scelta",type:"button","aria-pressed":String(citta.vestito===k),testo:v.nome});
    b.addEventListener("click",()=>{ citta.vestito=k; citta.vestitoScelto=true; salva(); rivesti(); apriFoglio("sartoria",true); });
    vest.appendChild(b); });
  out.push(el("div",{class:"sezione",testo:"Come ti vesti?"}), vest);
  const tin=el("div",{class:"tinte",role:"group","aria-label":"Colore"});
  TINTE.forEach(t=>{ const b=el("button",{class:"tinta"+(t===null?" originale":""),type:"button","aria-label":t===null?"colore originale":"colore",
      "aria-pressed":String((citta.colore??null)===t)});
    if(t!==null) b.style.background="#"+t.toString(16).padStart(6,"0");
    b.addEventListener("click",()=>{ citta.colore=t; salva(); rivesti(); apriFoglio("sartoria",true); }); tin.appendChild(b); });
  out.push(el("div",{class:"sezione",testo:"Colore"}), tin);
  const pel=el("div",{class:"tinte",role:"group","aria-label":"Pelle"});
  PELLI.forEach((t,i)=>{ const b=el("button",{class:"tinta",type:"button","aria-label":"tono della pelle "+(i+1),"aria-pressed":String(citta.pelle===i)});
    b.style.background="#"+t.toString(16).padStart(6,"0");
    b.addEventListener("click",()=>{ citta.pelle=i; salva(); rivesti(); apriFoglio("sartoria",true); }); pel.appendChild(b); });
  out.push(el("div",{class:"sezione",testo:"Pelle"}), pel);
  const fatto=el("button",{class:"vai-pagina",type:"button",testo:"Fatto"}); fatto.addEventListener("click",chiudiFoglio);
  const az=el("div",{class:"azioni",style:"margin-top:18px"}, fatto);
  if(citta.mestiere && !io.inviato) az.append(vai(PAGINA+"#inizia","Le domande del mio mestiere",true));
  out.push(az, el("p",{class:"piccolo",testo:"Resta in questo telefono: non lo mando a nessuno."}));
  return out;
}

let fogliAperto=null;
function apriFoglio(id, resta){
  const L=LUOGHI[id]; if(!L) return;
  const d=$("foglio-dentro"); const su=$("foglio").scrollTop;
  d.textContent=""; L.foglio().forEach(x=>{ if(x) d.appendChild(x); });
  $("foglio").classList.add("aperto"); $("foglio").setAttribute("aria-hidden","false");
  if(resta) $("foglio").scrollTop=su; else $("foglio").scrollTop=0;
  fogliAperto=id; segnaFermata(id); $("entra").hidden=true;
  document.body.classList.add("con-foglio"); document.body.classList.toggle("in-sartoria", id==="sartoria");
  if(scena.pronta) scena.modo(id==="sartoria"?"sartoria":"cammina");
}
function chiudiFoglio(){
  $("foglio").classList.remove("aperto"); $("foglio").setAttribute("aria-hidden","true");
  const era=fogliAperto; fogliAperto=null; document.body.classList.remove("con-foglio","in-sartoria");
  if(scena.pronta) scena.modo("cammina");
  if(FERMATE.every(f=>citta.giro[f[0]]) && !citta.giroVisto && era){ /* il giro chiuso si vede una volta */ setTimeout(()=>{ citta.giroVisto=true; salva(); }, 6000); }
}
$("chiudi").addEventListener("click", chiudiFoglio);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") chiudiFoglio(); });

$("vai").addEventListener("click",()=>{

const MAT=new Map();
const mat=(c,emi)=>{ const k=c+"|"+(emi||0); if(!MAT.has(k)) MAT.set(k, emi? new THREE.MeshBasicMaterial({color:c}) : new THREE.MeshLambertMaterial({color:c})); return MAT.get(k); };
const GEO={};
const scatola=(w,h,d,c,emi)=>{ const k=`b${w},${h},${d}`; GEO[k]=GEO[k]||new THREE.BoxGeometry(w,h,d); return new THREE.Mesh(GEO[k], mat(c,emi)); };
const palla=(r,c,emi,seg=12)=>{ const k=`s${r},${seg}`; GEO[k]=GEO[k]||new THREE.SphereGeometry(r,seg,Math.max(6,seg*0.75|0)); return new THREE.Mesh(GEO[k], mat(c,emi)); };
const cilindro=(rt,rb,h,c,seg=10,emi)=>{ const k=`c${rt},${rb},${h},${seg}`; GEO[k]=GEO[k]||new THREE.CylinderGeometry(rt,rb,h,seg); return new THREE.Mesh(GEO[k], mat(c,emi)); };
const tela=(w,h)=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; };
const tex=c=>{ const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=2; return t; };

// ── l'avatar: lo stesso per te, per i passanti e per i manichini ──
function avatar(st){
  const v=VESTITI[st.vestito]||VESTITI.altro;
  const maglia=(typeof st.colore==="number")?st.colore:v.maglia;
  const pelle=PELLI[st.pelle??1]; const capelli=0x2b1d14;
  const g=new THREE.Group(); const gambe=[], braccia=[];
  for(const s of [-1,1]){
    const p=new THREE.Group(); p.position.set(0.15*s,0.9,0);
    const l=scatola(0.22,0.82,0.24,st.vestito==="artigiano"&&typeof st.colore==="number"?maglia:v.pantaloni); l.position.y=-0.41; p.add(l);
    const sc=scatola(0.24,0.12,0.32,v.scarpe); sc.position.set(0,-0.85,0.04); p.add(sc);
    g.add(p); gambe.push(p);
  }
  const busto=scatola(0.56,0.7,0.32,maglia); busto.position.y=1.25; g.add(busto);
  for(const s of [-1,1]){
    const p=new THREE.Group(); p.position.set(0.37*s,1.55,0);
    const a=scatola(0.17,0.6,0.2,maglia); a.position.y=-0.29; p.add(a);
    const m=scatola(0.15,0.14,0.17,pelle); m.position.y=-0.66; p.add(m);
    g.add(p); braccia.push(p);
  }
  const collo=scatola(0.16,0.1,0.16,pelle); collo.position.y=1.64; g.add(collo);
  const testa=palla(0.24,pelle); testa.position.y=1.88; g.add(testa);
  for(const s of [-1,1]){ const o=scatola(0.05,0.06,0.02,0x111111); o.position.set(0.08*s,1.91,0.225); g.add(o); }
  let cappello=false;
  const add=(m,x,y,z)=>{ m.position.set(x,y,z); g.add(m); return m; };
  switch(st.vestito){
    case "corriere":{ cappello=true;
      add(cilindro(0.25,0.25,0.12,maglia,14),0,2.06,0);
      add(scatola(0.34,0.03,0.2,maglia),0,2.01,0.24);
      add(scatola(0.46,0.34,0.34,0xc8a165),0,1.12,0.42);
      braccia.forEach(b=>{ b.rotation.x=-1.05; }); g.userData.ferme=true; break; }
    case "negozio":{ add(scatola(0.5,0.85,0.04,0x2f8f5b),0,1.05,0.18); break; }
    case "artigiano":{ cappello=true;
      const e=palla(0.27,0xffc21a); e.scale.y=0.7; add(e,0,2.02,0);
      add(cilindro(0.33,0.33,0.03,0xffc21a,14),0,1.98,0.02);
      add(scatola(0.6,0.1,0.36,0x5a3b22),0,0.93,0); break; }
    case "sanita":{ add(scatola(0.58,0.5,0.34,0xf7f7f7),0,0.72,0);
      const t=new THREE.Mesh(new THREE.TorusGeometry(0.12,0.018,6,16),mat(0x333333)); add(t,0,1.42,0.17); break; }
    case "ufficio":{ add(scatola(0.16,0.22,0.02,0xffffff),0,1.5,0.165); add(scatola(0.07,0.42,0.025,0xb3262e),0,1.3,0.17); break; }
    case "studio":{ add(scatola(0.42,0.5,0.2,0x2b3a4a),0,1.25,-0.26); break; }
    case "guida":{ const pole=cilindro(0.02,0.02,1.3,0x8a7a60,6); pole.position.set(0,0.1,0); braccia[1].add(pole);
      const fl=scatola(0.36,0.24,0.02,0xffd60a); fl.position.set(0.18,0.62,0); pole.add(fl);
      braccia[1].rotation.x=-0.5; g.userData.alzato=true; break; }
    case "creator":{ const t=new THREE.Mesh(new THREE.TorusGeometry(0.27,0.03,6,18,Math.PI),mat(0x00B4D8)); add(t,0,1.9,0);
      for(const s of [-1,1]) add(scatola(0.07,0.16,0.14,0x222222),0.26*s,1.88,0);
      add(scatola(0.57,0.05,0.33,0x00B4D8,true),0,1.42,0); break; }
    case "jjavis":{ for(const x of [-0.18,0.18]) add(scatola(0.03,0.66,0.33,0x00B4D8,true),x,1.25,0);
      add(scatola(0.12,0.12,0.02,0xffd60a,true),0,1.38,0.17);
      for(const s of [-1,1]) add(scatola(0.03,0.8,0.25,0x00B4D8,true),0.15*s+0.11*s,0.5,0); break; }
  }
  if(!cappello){ const c=palla(0.255,capelli); c.scale.set(1,0.62,1); c.position.set(0,1.98,-0.02); g.add(c); }
  g.userData.gambe=gambe; g.userData.braccia=braccia; g.userData.fase=Math.random()*6;
  return g;
}
function cammina(av, passo){
  const u=av.userData; u.fase+=passo; const a=Math.sin(u.fase)*0.6*Math.min(1,passo*20);
  u.gambe[0].rotation.x=a; u.gambe[1].rotation.x=-a;
  if(!u.ferme){ u.braccia[0].rotation.x=-a*0.8; if(!u.alzato) u.braccia[1].rotation.x=a*0.8; }
}
function fermo(av){ const u=av.userData; u.gambe.forEach(g=>g.rotation.x*=0.8); if(!u.ferme){ u.braccia[0].rotation.x*=0.8; if(!u.alzato) u.braccia[1].rotation.x*=0.8; } }

// ── insegne e facciate, disegnate nel telefono ──
function insegna(titolo, sotto, larghezza, colore="#CAF0F8"){
  const W=1024,H=256, c=tela(W,H), x=c.getContext("2d");
  x.fillStyle="rgba(2,11,24,.94)"; x.fillRect(0,0,W,H);
  x.strokeStyle="#0D3A5C"; x.lineWidth=6; x.strokeRect(3,3,W-6,H-6);
  x.strokeStyle="#00B4D8"; x.lineWidth=8; x.beginPath(); x.moveTo(4,60); x.lineTo(4,4); x.lineTo(60,4); x.moveTo(W-4,H-60); x.lineTo(W-4,H-4); x.lineTo(W-60,H-4); x.stroke();
  let f=sotto?118:140; x.font=`800 ${f}px Archivo, sans-serif`;
  while(x.measureText(titolo).width>W-80 && f>40){ f-=6; x.font=`800 ${f}px Archivo, sans-serif`; }
  x.textAlign="center"; x.textBaseline="middle"; x.fillStyle=colore; x.shadowColor="#00B4D8"; x.shadowBlur=18;
  x.fillText(titolo, W/2, sotto?H*0.42:H/2); x.shadowBlur=0;
  if(sotto){ let g=46; x.font=`400 ${g}px "DM Mono", monospace`; while(x.measureText(sotto).width>W-80 && g>22){ g-=2; x.font=`400 ${g}px "DM Mono", monospace`; }
    x.fillStyle="#48CAE4"; x.fillText(sotto, W/2, H*0.78); }
  const m=new THREE.Mesh(new THREE.PlaneGeometry(larghezza, larghezza/4), new THREE.MeshBasicMaterial({map:tex(c)}));
  return m;
}
function facciata(w,h,{muro="#c9b9a0",porta=false,vetrine=0,serranda=false,vetro=false,luce=0.7,seme=1}){
  const k=24, cw=Math.max(16,Math.round(w*k)), ch=Math.max(16,Math.round(h*k));
  const c=tela(cw,ch), e=tela(cw,ch), x=c.getContext("2d"), y=e.getContext("2d");
  let s=seme*9301; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  x.fillStyle=muro; x.fillRect(0,0,cw,ch); y.fillStyle="#000"; y.fillRect(0,0,cw,ch);
  x.fillStyle="rgba(0,0,0,.08)"; for(let r=0;r<ch;r+=12) x.fillRect(0,r,cw,1);
  x.fillStyle="rgba(0,0,0,.25)"; x.fillRect(0,ch-0.5*k,cw,0.5*k);
  const fin=(fx,fy,fw,fh,acc,col)=>{ x.fillStyle=acc?(col||"#ffe2a8"):"#0b1a2a"; x.fillRect(fx,fy,fw,fh);
    x.strokeStyle="rgba(0,0,0,.45)"; x.lineWidth=2; x.strokeRect(fx,fy,fw,fh);
    if(acc){ y.fillStyle=col||"#ffd9a0"; y.fillRect(fx+2,fy+2,fw-4,fh-4); } };
  if(vetro){ for(let px=0.4*k;px<cw-0.4*k;px+=1.6*k){ fin(px,0.7*k,1.3*k,ch-1.3*k,true,"#9fe9ff"); } return {map:tex(c),emi:tex(e)}; }
  const piani=Math.max(1,Math.floor(h/3));
  const colonne=Math.max(1,Math.floor(w/2.4));
  const passo=cw/colonne;
  for(let p=0;p<piani;p++){
    if(p===0 && (porta||vetrine||serranda)) continue;
    const fy=ch-(p*3+1.0)*k-1.5*k;
    for(let cI=0;cI<colonne;cI++) fin(cI*passo+passo/2-0.55*k, fy, 1.1*k, 1.5*k, rnd()<luce);
  }
  if(serranda){ const sw=Math.min(cw-2*k,5.5*k), sx=(cw-sw)/2, sh=3.4*k;
    x.fillStyle="#7d8794"; x.fillRect(sx,ch-sh,sw,sh); x.fillStyle="rgba(0,0,0,.25)"; for(let r=ch-sh;r<ch;r+=6) x.fillRect(sx,r,sw,2);
    y.strokeStyle="#00B4D8"; y.lineWidth=4; y.strokeRect(sx-2,ch-sh-2,sw+4,sh+4); }
  if(vetrine){ const vw=2.6*k, vh=2.1*k;
    for(const lato of [-1,1]) for(let i=0;i<vetrine;i++){ const vx=cw/2+lato*(1.6*k+i*(vw+0.4*k))-(lato<0?vw:0); fin(vx,ch-vh-0.6*k,vw,vh,true,"#fff1c9"); } }
  if(porta){ const pw=1.8*k, ph=2.6*k, px=(cw-pw)/2; x.fillStyle="#06121f"; x.fillRect(px,ch-ph,pw,ph);
    y.strokeStyle="#00B4D8"; y.lineWidth=5; y.strokeRect(px,ch-ph,pw,ph); x.strokeStyle="#00B4D8"; x.lineWidth=5; x.strokeRect(px,ch-ph,pw,ph);
    y.fillStyle="#0a3550"; y.fillRect(px+4,ch-ph+4,pw-8,ph-8); }
  return {map:tex(c),emi:tex(e)};
}

// ══ COSTRUZIONE ══
async function costruisci(){
  const tela3d=$("scena");
  let renderer;
  try{ renderer=new THREE.WebGLRenderer({canvas:tela3d, antialias:true, powerPreference:"high-performance"}); }
  catch(e){ riserva("Questo browser non riesce a disegnare la città in 3D."); return; }
  if(!renderer.getContext()){ riserva("Questo browser non riesce a disegnare la città in 3D."); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
  renderer.setSize(innerWidth, innerHeight, false);

  // le insegne vogliono i font veri: si aspettano al massimo due secondi e mezzo
  try{ await Promise.race([Promise.all([document.fonts.load('800 100px Archivo'),document.fonts.load('400 40px "DM Mono"')]), new Promise(r=>setTimeout(r,2500))]); }catch(_){}

  const S=new THREE.Scene();
  S.background=new THREE.Color(0x061428);
  S.fog=new THREE.Fog(0x061428, 45, 120);
  const cam=new THREE.PerspectiveCamera(innerHeight>innerWidth?68:58, innerWidth/innerHeight, 0.1, 400);

  S.add(new THREE.HemisphereLight(0xdde8ff, 0x2a2622, 1.7));
  const luna=new THREE.DirectionalLight(0xfff1dc, 1.4); luna.position.set(-30,60,25); S.add(luna);

  // cielo: sfumatura e stelle
  { const c=tela(4,256), x=c.getContext("2d"), gr=x.createLinearGradient(0,0,0,256);
    gr.addColorStop(0,"#01060f"); gr.addColorStop(0.55,"#071a33"); gr.addColorStop(0.8,"#16324f"); gr.addColorStop(1,"#3a2a3f");
    x.fillStyle=gr; x.fillRect(0,0,4,256);
    const cielo=new THREE.Mesh(new THREE.SphereGeometry(300,24,16), new THREE.MeshBasicMaterial({map:tex(c),side:THREE.BackSide,fog:false}));
    S.add(cielo);
    const p=[]; for(let i=0;i<700;i++){ const t=Math.random()*Math.PI*2, f=Math.random()*1.25; p.push(Math.cos(t)*Math.cos(f)*280, Math.sin(f)*280+10, Math.sin(t)*Math.cos(f)*280); }
    const sg=new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(p,3));
    S.add(new THREE.Points(sg, new THREE.PointsMaterial({color:0xcaf0f8,size:1.6,sizeAttenuation:false,fog:false}))); }

  // il suolo: prato scuro, la piazza con la griglia della pagina, l'anello di strada, il viale d'ingresso
  { const prato=new THREE.Mesh(new THREE.PlaneGeometry(400,400), mat(0x10261c)); prato.rotation.x=-Math.PI/2; S.add(prato); }
  { const c=tela(256,256), x=c.getContext("2d"); x.fillStyle="#0c2236"; x.fillRect(0,0,256,256);
    x.strokeStyle="rgba(0,180,216,.35)"; x.lineWidth=2; for(let i=0;i<=256;i+=64){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,256); x.stroke(); x.beginPath(); x.moveTo(0,i); x.lineTo(256,i); x.stroke(); }
    x.fillStyle="rgba(255,255,255,.03)"; for(let i=0;i<256;i+=32) for(let j=0;j<256;j+=32) if((i+j)%64===0) x.fillRect(i,j,32,32);
    const t=tex(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(12,12);
    const piazza=new THREE.Mesh(new THREE.CircleGeometry(22,72), new THREE.MeshLambertMaterial({map:t}));
    piazza.rotation.x=-Math.PI/2; piazza.position.y=0.02; S.add(piazza);
    const t2=t.clone(); t2.repeat.set(2,7); t2.needsUpdate=true;
    const viale=new THREE.Mesh(new THREE.PlaneGeometry(7,30), new THREE.MeshLambertMaterial({map:t2}));
    viale.rotation.x=-Math.PI/2; viale.position.set(0,0.015,37); S.add(viale); }
  { const anello=new THREE.Mesh(new THREE.RingGeometry(22,25.5,72), mat(0x161c27)); anello.rotation.x=-Math.PI/2; anello.position.y=0.01; S.add(anello);
    const bordo=new THREE.Mesh(new THREE.RingGeometry(21.85,22.05,72), mat(0x00B4D8,true)); bordo.rotation.x=-Math.PI/2; bordo.position.y=0.03; S.add(bordo); }

  const solidi=[];      // cosa non si attraversa: {x,z,r,w,d} ruotati, oppure cerchi
  const toccabili=[];   // cosa si tocca col dito: mesh → id del luogo
  const porte={};       // dove ci si ferma davanti a ogni luogo
  const muri=[];        // per non far entrare la telecamera nei palazzi

  // ── i palazzi: sull'anello, la facciata verso l'albero ──
  const R=31;
  const PALAZZI=[
    {id:"reception",ang:-22,w:11,d:7,h:6,muro:"#1b3a57",vetro:true,tetto:"piano",titolo:"RECEPTION",sotto:"qui nasce il tuo assistente"},
    {id:"sartoria", ang:22, w:9, d:7,h:7,muro:"#c99a8a",vetrine:1,tetto:"falde",titolo:"SARTORIA",sotto:"vesti il tuo avatar"},
    {id:"borsa",    ang:58, w:9, d:9,h:10,muro:"#d9d2c2",porta:true,tetto:"piano",titolo:"BORSA",sotto:"investi in JJA-VIS",colonne:true},
    {id:"voci",     ang:92, w:11,d:9,h:9,muro:"#b5654a",porta:true,tetto:"piano",titolo:"PIAZZA DELLE VOCI",sotto:"cosa ti fa perdere tempo?",orologio:true},
    {id:"cinema",   ang:126,w:11,d:9,h:8,muro:"#3b2a4f",porta:true,tetto:"piano",titolo:"CINEMA",sotto:"guardami al lavoro",colore:"#FFD60A"},
    {id:"giochi",   ang:154,w:10,d:9,h:8,muro:"#24123a",porta:true,tetto:"piano",titolo:"SALA GIOCHI",sotto:"i giochi di chi mi costruisce",colore:"#ff4fd8",neon:true},
    {id:"torre",    ang:180,w:9, d:9,h:30,muro:"#0f2d47",porta:true,tetto:"piano",titolo:"LA TORRE",sotto:"chi sono · cosa so fare",luce:0.85,r:34},
    {id:"lotto",    ang:206,w:9, d:8,h:0,titolo:"LOTTO LIBERO",sotto:"la tua attività, qui"},
    {id:"forgia",   ang:234,w:11,d:9,h:7,muro:"#4a3b33",porta:true,tetto:"falde",titolo:"LA FORGIA",sotto:"su misura, adesso",camino:true},
    {id:"bottega",  ang:268,w:13,d:9,h:7,muro:"#e3cfa8",vetrine:1,tetto:"falde",titolo:"BOTTEGA",sotto:"i prodotti di JJA-VIS",tenda:true},
    {id:"athena",   ang:302,w:11,d:10,h:6,muro:"#9aa3ad",serranda:true,tetto:"piano",titolo:"ATHENA TRASPORTI",sotto:"consegne · urgenze · sgomberi",furgone:true},
  ];
  let seme=1, lottiN=0;
  for(const P of PALAZZI){
    const a=P.ang*Math.PI/180, r=P.r||R;
    const px=Math.sin(a)*r, pz=Math.cos(a)*r;
    const g=new THREE.Group(); g.position.set(px,0,pz);
    const dx=-px/r, dz=-pz/r; g.rotation.y=Math.atan2(dx,dz);
    S.add(g);
    const fronte=new THREE.Vector3(px+dx*(P.d/2+2.4),0,pz+dz*(P.d/2+2.4));
    const chiave=P.id==="lotto"?`lotto${lottiN++}`:P.id;
    porte[chiave]={id:P.id, x:fronte.x, z:fronte.z, guarda:Math.atan2(-dx,-dz)};

    if(P.id==="lotto"){
      // un lotto: recinto basso, la sagoma di un palazzo che ancora non c'è, il cartello
      const sag=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(P.w,7,P.d)), new THREE.LineBasicMaterial({color:0x00B4D8,transparent:true,opacity:.55}));
      sag.position.y=3.5; g.add(sag);
      const base=new THREE.Mesh(new THREE.PlaneGeometry(P.w,P.d), mat(0x2a2218)); base.rotation.x=-Math.PI/2; base.position.y=0.03; g.add(base);
      for(const [fx,fz,fw,fd] of [[0,-P.d/2,P.w,0.08],[-P.w/2,0,0.08,P.d],[P.w/2,0,0.08,P.d]]){ const f=scatola(fw,0.6,fd,0x8a7a60); f.position.set(fx,0.3,fz); g.add(f); }
      const palo=cilindro(0.07,0.07,2.6,0x8a7a60,6); palo.position.set(0,1.3,P.d/2-0.3); g.add(palo);
      const ins=insegna(P.titolo,P.sotto,3.6,"#FFD60A"); ins.position.set(0,2.4,P.d/2-0.22); g.add(ins);
      const tocco=new THREE.Mesh(new THREE.BoxGeometry(P.w,7,P.d), new THREE.MeshBasicMaterial({visible:false})); tocco.position.y=3.5; g.add(tocco);
      toccabili.push([tocco,chiave]); continue;
    }

    const lato=facciata(P.d,P.h,{muro:P.muro,luce:P.luce??0.6,seme:seme++, vetro:false});
    const fr=facciata(P.w,P.h,{muro:P.muro,porta:P.porta,vetrine:P.vetrine,serranda:P.serranda,vetro:P.vetro,luce:P.luce??0.6,seme:seme++});
    const retro=facciata(P.w,P.h,{muro:P.muro,luce:P.luce??0.6,seme:seme++});
    const M=t=>new THREE.MeshLambertMaterial({map:t.map,emissiveMap:t.emi,emissive:0xffffff,emissiveIntensity:0.95});
    const tetto=mat(0x2b2f36);
    const corpo=new THREE.Mesh(new THREE.BoxGeometry(P.w,P.h,P.d), [M(lato),M(lato),tetto,tetto,M(fr),M(retro)]);
    corpo.position.y=P.h/2; g.add(corpo); toccabili.push([corpo,chiave]); muri.push(corpo);
    if(P.vetro){ const cornice=scatola(P.w+0.3,0.5,P.d+0.3,0x0D3A5C); cornice.position.y=P.h+0.25; g.add(cornice);
      const lin=scatola(P.w+0.32,0.08,0.08,0x00B4D8,true); lin.position.set(0,P.h+0.5,P.d/2+0.15); g.add(lin); }
    if(P.tetto==="falde"){ const t=new THREE.Mesh(new THREE.ConeGeometry(1,1,4), mat(P.id==="forgia"?0x2f2a28:0x9c4a32));
      t.rotation.y=Math.PI/4; t.scale.set(P.w/1.414*1.08, 2.6, P.d/1.414*1.08); t.position.y=P.h+1.3; g.add(t); }
    else if(!P.vetro){ const c=scatola(P.w+0.4,0.4,P.d+0.4,0x2b2f36); c.position.y=P.h+0.2; g.add(c); }

    const ins=insegna(P.titolo,P.sotto,Math.min(P.w*0.85,8),P.colore);
    ins.position.set(0, P.id==="torre"?4.4:Math.min(P.h-1.2,4.3), P.d/2+0.06); g.add(ins);

    if(P.tenda){ const c=tela(64,16), x=c.getContext("2d"); for(let i=0;i<8;i++){ x.fillStyle=i%2?"#0D3A5C":"#00B4D8"; x.fillRect(i*8,0,8,16); }
      const tenda=new THREE.Mesh(new THREE.BoxGeometry(P.w*0.95,0.08,1.8), new THREE.MeshLambertMaterial({map:tex(c)}));
      tenda.position.set(0,3.0,P.d/2+0.85); tenda.rotation.x=0.28; g.add(tenda);
      // in vetrina, i prodotti
      ["CLIO","SOPRALLUOGO","SU MISURA"].forEach((n,i)=>{ const v=insegna(n,"",2.2,"#FFD60A"); v.position.set((i-1)*2.6-0.0,1.15,P.d/2+0.4); v.rotation.x=-0.15;
        const sup=scatola(2.3,0.08,0.5,0x5a3b22); sup.position.set((i-1)*2.6,0.85,P.d/2+0.45); g.add(sup, v); }); }
    if(P.colonne){ for(let i=0;i<4;i++){ const c=cilindro(0.32,0.36,P.h-1,0xeee8da,12); c.position.set(-P.w/2+1.2+i*(P.w-2.4)/3,(P.h-1)/2,P.d/2+1.2); g.add(c);
        solidi.push({cerchio:true,x:px+Math.cos(g.rotation.y)*c.position.x+Math.sin(g.rotation.y)*c.position.z, z:pz-Math.sin(g.rotation.y)*c.position.x+Math.cos(g.rotation.y)*c.position.z, r:0.45}); }
      const fr2=scatola(P.w+0.6,0.8,2.4,0xe7e1d2); fr2.position.set(0,P.h-0.6,P.d/2+1.1); g.add(fr2); }
    if(P.orologio){ const c=tela(256,256), x=c.getContext("2d"); x.fillStyle="#f4ecd6"; x.beginPath(); x.arc(128,128,120,0,7); x.fill();
      x.strokeStyle="#20160f"; x.lineWidth=10; x.stroke(); x.lineWidth=12; x.lineCap="round";
      const ora=new Date(), h=(ora.getHours()%12+ora.getMinutes()/60)/12*Math.PI*2, m=ora.getMinutes()/60*Math.PI*2;
      x.beginPath(); x.moveTo(128,128); x.lineTo(128+Math.sin(h)*60,128-Math.cos(h)*60); x.stroke();
      x.lineWidth=7; x.beginPath(); x.moveTo(128,128); x.lineTo(128+Math.sin(m)*95,128-Math.cos(m)*95); x.stroke();
      const torre=scatola(3,4,3,0xa45a42); torre.position.set(0,P.h+2.2,0); g.add(torre);
      const quad=new THREE.Mesh(new THREE.CircleGeometry(1.15,32), new THREE.MeshBasicMaterial({map:tex(c)})); quad.position.set(0,P.h+2.4,1.52); g.add(quad);
      const cupola=new THREE.Mesh(new THREE.ConeGeometry(2.3,1.8,4), mat(0x2f3b4a)); cupola.rotation.y=Math.PI/4; cupola.position.y=P.h+5.1; g.add(cupola); }
    if(P.camino){ const c=scatola(1,3.5,1,0x3a302b); c.position.set(P.w/2-1.6,P.h+2.2,-1); g.add(c);
      const brace=scatola(0.8,0.2,0.8,0xff7a1a,true); brace.position.set(P.w/2-1.6,P.h+4.0,-1); g.add(brace);
      const fuoco=new THREE.PointLight(0xff7a1a, 40, 16, 2); fuoco.position.set(0,2.2,P.d/2+1.5); g.add(fuoco);
      const inc=scatola(1.6,0.9,0.8,0x2a2a2a); inc.position.set(P.w/2-2,0.45,P.d/2+0.8); g.add(inc); // l'incudine fuori bottega
    }
    if(P.neon){ for(const [y,c] of [[P.h-0.4,0xff4fd8],[P.h-0.8,0x00B4D8]]){ const l=scatola(P.w+0.1,0.12,0.12,c,true); l.position.set(0,y,P.d/2+0.08); g.add(l); }
      for(const s of [-1,1]){ const l=scatola(0.12,P.h-0.5,0.12,0xff4fd8,true); l.position.set(s*(P.w/2+0.02),(P.h-0.5)/2,P.d/2+0.08); g.add(l); }
      const cab=[0xff4fd8,0x00B4D8,0xFFD60A]; cab.forEach((c,i)=>{ const m=scatola(0.8,1.8,0.7,0x15161a); m.position.set(-2.6+i*2.6+(i===1?0:0),0.9,P.d/2+1.2);
        if(i===1) return; const sc=scatola(0.6,0.45,0.05,c,true); sc.position.set(m.position.x,1.35,P.d/2+1.56); g.add(m,sc);
        solidi.push({cerchio:true,x:px+Math.cos(g.rotation.y)*m.position.x+Math.sin(g.rotation.y)*m.position.z,z:pz-Math.sin(g.rotation.y)*m.position.x+Math.cos(g.rotation.y)*m.position.z,r:0.6}); }); }
    if(P.id==="cinema"){ const mq=scatola(P.w*0.9,0.3,2,0x1a1024); mq.position.set(0,3.1,P.d/2+1); g.add(mq);
      for(let i=0;i<14;i++){ const l=palla(0.08,0xffd60a,true,6); l.position.set(-P.w*0.43+i*(P.w*0.86/13),2.92,P.d/2+2); g.add(l); } }
    if(P.id==="torre"){
      // il globo di JARVIS in cima alla torre: si vede da tutta la città
      const globo=new THREE.Group(); globo.position.set(0,P.h+6,0); g.add(globo);
      globo.add(new THREE.Mesh(new THREE.IcosahedronGeometry(3.4,2), new THREE.MeshBasicMaterial({color:0x00B4D8,wireframe:true,transparent:true,opacity:.8})));
      globo.add(new THREE.Mesh(new THREE.SphereGeometry(2.6,24,16), new THREE.MeshBasicMaterial({color:0x0077B6,transparent:true,opacity:.35})));
      const an=new THREE.Mesh(new THREE.TorusGeometry(4.3,0.08,6,64), new THREE.MeshBasicMaterial({color:0xFFD60A})); an.rotation.x=1.2; globo.add(an);
      const ant=cilindro(0.15,0.25,3,0x0D3A5C,8); ant.position.y=P.h+1.5; g.add(ant);
      scena._globo=globo;
    }
    if(P.furgone){
      // un furgone bianco davanti al deposito, con la scritta della ditta
      const f=new THREE.Group(); f.position.set(-3.2,0,P.d/2+3.6); f.rotation.y=Math.PI/2*0.9; g.add(f);
      const cass=scatola(2.1,2.3,4.2,0xf2f4f6); cass.position.set(0,1.55,-0.6); f.add(cass);
      const cab=scatola(2.0,1.5,1.6,0xf2f4f6); cab.position.set(0,1.15,2.3); f.add(cab);
      const vetro=scatola(1.9,0.7,0.05,0x1b2a3a); vetro.position.set(0,1.55,3.1); vetro.rotation.x=-0.35; f.add(vetro);
      for(const [wx,wz] of [[-1,-2],[1,-2],[-1,2.1],[1,2.1]]){ const r=cilindro(0.42,0.42,0.3,0x151515,14); r.rotation.z=Math.PI/2; r.position.set(wx*1.0,0.42,wz); f.add(r); }
      for(const s of [-1,1]){ const sc=insegna("ATHENA TRASPORTI","",3.6); sc.position.set(1.06*s,1.7,-0.6); sc.rotation.y=s*Math.PI/2; f.add(sc); }
      const fari=scatola(1.7,0.18,0.05,0xfff3c4,true); fari.position.set(0,0.9,3.12); f.add(fari);
      const fw=new THREE.Vector3(); f.getWorldPosition(fw);
      solidi.push({cerchio:true,x:fw.x,z:fw.z,r:2.6});
      // dove si sta davanti, non sopra al furgone
      porte[chiave].x=px+dx*(P.d/2+2.2)+dz*2.4; porte[chiave].z=pz+dz*(P.d/2+2.2)-dx*2.4;
    }
    solidi.push({x:px,z:pz,rot:g.rotation.y,w:P.w+(P.colonne?0:0),d:P.d+(P.colonne?0.2:0)});
  }

  // i manichini della Sartoria: tre vestiti in vetrina, fuori
  { const P=PALAZZI[1], a=P.ang*Math.PI/180, px=Math.sin(a)*R, pz=Math.cos(a)*R, dx=-px/R, dz=-pz/R;
    ["guida","artigiano","creator"].forEach((v,i)=>{ const m=avatar({vestito:v,pelle:[0,2,4][i]});
      const off=(i-1)*2.4; m.position.set(px+dx*(P.d/2+1.0)+(-dz)*off, 0.25, pz+dz*(P.d/2+1.0)+dx*off); m.rotation.y=Math.atan2(dx,dz);
      const ped=cilindro(0.45,0.5,0.25,0x0D3A5C,14); ped.position.set(m.position.x,0.125,m.position.z); S.add(ped, m); toccabili.push([m,"sartoria"]); solidi.push({cerchio:true,x:m.position.x,z:m.position.z,r:0.5}); }); }

  // ── l'Albero della Vita, al centro ──
  const albero=new THREE.Group(); S.add(albero);
  { const tronco=cilindro(0.75,1.5,7.5,0x2a2420,10); tronco.position.y=3.75; albero.add(tronco);
    for(let i=0;i<6;i++){ const r=cilindro(0.18,0.5,3.2,0x2a2420,6); const a=i/6*Math.PI*2; r.position.set(Math.sin(a)*1.6,0.35,Math.cos(a)*1.6); r.rotation.set(Math.cos(a)*1.35,0,-Math.sin(a)*1.35); albero.add(r); }
    for(let i=0;i<7;i++){ const b=cilindro(0.15,0.4,4.5,0x2a2420,6); const a=i/7*Math.PI*2+0.3; b.position.set(Math.sin(a)*1.6,8.2,Math.cos(a)*1.6); b.rotation.set(Math.cos(a)*0.9,0,-Math.sin(a)*0.9); albero.add(b); }
    const vena=scatola(0.06,6,0.06,0x00B4D8,true); vena.position.set(0,3.6,0.98); vena.rotation.x=-0.1; albero.add(vena);
    const chioma=new THREE.Group(); chioma.position.y=9.5; albero.add(chioma); scena._chioma=chioma;
    const N=72, PER=7; const foglie=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.2,0), new THREE.MeshBasicMaterial({color:0xffffff}), N*PER);
    const m4=new THREE.Matrix4(), col=new THREE.Color(); const fili=[]; let n=0, piuBassa=null;
    for(let s=0;s<N;s++){ const a=s*2.39996, rr=1.8+Math.sqrt(s/N)*5.6, sx=Math.sin(a)*rr, sz=Math.cos(a)*rr, sy=1.2-rr*0.18;
      const lung=3+((s*37)%10)/10*3.2;
      for(let k=0;k<PER;k++){ const y=sy-k*(lung/PER); m4.makeTranslation(sx+Math.sin(k)*0.1,y,sz+Math.cos(k)*0.1); foglie.setMatrixAt(n,m4);
        col.setHex([0x00B4D8,0x48CAE4,0x7ff0ff,0x2ad4c0][(s+k)%4]); foglie.setColorAt(n,col);
        if(!piuBassa || y<piuBassa.y) piuBassa={n,x:sx,y,z:sz}; n++; }
      fili.push(sx,sy+0.3,sz, sx,sy-lung,sz); }
    if(nomeAssistente() && piuBassa){ col.setHex(0xFFD60A); foglie.setColorAt(piuBassa.n,col);
      const oro=palla(0.34,0xFFD60A,true,10); oro.position.set(piuBassa.x,piuBassa.y,piuBassa.z); chioma.add(oro); scena._oro=oro; }
    foglie.instanceColor.needsUpdate=true; chioma.add(foglie);
    const fg=new THREE.BufferGeometry(); fg.setAttribute("position", new THREE.Float32BufferAttribute(fili,3));
    chioma.add(new THREE.LineSegments(fg, new THREE.LineBasicMaterial({color:0x48CAE4,transparent:true,opacity:.35})));
    const cuore=new THREE.PointLight(0x48CAE4, 160, 30, 2); cuore.position.y=7; albero.add(cuore);
    const anello=new THREE.Mesh(new THREE.RingGeometry(2.6,2.9,48), mat(0x00B4D8,true)); anello.rotation.x=-Math.PI/2; anello.position.y=0.04; albero.add(anello);
    const tocco=new THREE.Mesh(new THREE.CylinderGeometry(3,3,9,8), new THREE.MeshBasicMaterial({visible:false})); tocco.position.y=4.5; albero.add(tocco);
    toccabili.push([tocco,"albero"]);
    const cart=insegna("L'ALBERO DELLA VITA","ogni JJA-VIS è un nodo",3.2); cart.position.set(0,1.1,3.3); albero.add(cart);
    const cp=cilindro(0.05,0.05,1,0x8a7a60,6); cp.position.set(0,0.5,3.28); albero.add(cp);
    solidi.push({cerchio:true,x:0,z:0,r:2.2});
    porte.albero={id:"albero",x:0,z:4.8,guarda:Math.PI};
  }
  // panchine intorno all'albero, lampioni intorno alla piazza, alberi fuori
  for(let i=0;i<4;i++){ const a=i/4*Math.PI*2+Math.PI/4, b=new THREE.Group(); b.position.set(Math.sin(a)*6.5,0,Math.cos(a)*6.5); b.rotation.y=a+Math.PI;
    const s=scatola(2.2,0.1,0.6,0x6b4a2e); s.position.y=0.5; const sc=scatola(2.2,0.6,0.1,0x6b4a2e); sc.position.set(0,0.85,-0.28);
    for(const x of [-0.9,0.9]){ const z=scatola(0.08,0.5,0.5,0x222222); z.position.set(x,0.25,0); b.add(z); } b.add(s,sc); S.add(b); }
  for(let i=0;i<12;i++){ const a=i/12*Math.PI*2+0.13; if(Math.abs(Math.sin(a))<0.12 && Math.cos(a)>0) continue;
    const x=Math.sin(a)*20.8, z=Math.cos(a)*20.8; const p=cilindro(0.07,0.1,4.2,0x1c2a38,6); p.position.set(x,2.1,z);
    const l=palla(0.26,0xffe7b0,true,8); l.position.set(x,4.3,z); S.add(p,l); solidi.push({cerchio:true,x,z,r:0.3}); }
  for(let i=0;i<34;i++){ const a=i/34*Math.PI*2+0.07, r=44+(i*13%9); const x=Math.sin(a)*r, z=Math.cos(a)*r; if(Math.abs(x)<6 && z>0) continue;
    const t=cilindro(0.2,0.3,1.6,0x3b2a1e,6); t.position.set(x,0.8,z); const c=new THREE.Mesh(new THREE.ConeGeometry(1.6+(i%3)*0.4,4+(i%4),7), mat([0x1f4a33,0x245a3a,0x1a3d2b][i%3])); c.position.set(x,3.4+(i%4)/2,z); S.add(t,c); }
  // il cancello d'ingresso
  { for(const s of [-1,1]){ const p=scatola(0.8,6,0.8,0x0D3A5C); p.position.set(4.5*s,3,46); S.add(p); solidi.push({cerchio:true,x:4.5*s,z:46,r:0.7}); }
    const arco=insegna("JJA-VIS","la città",8); arco.position.set(0,6.4,45.98); arco.rotation.y=Math.PI; S.add(arco);
    const arco2=insegna("LA CITTÀ DI JJA-VIS","benvenuto, entra pure",8); arco2.position.set(0,6.4,46.02); S.add(arco2); }

  // ── tu, e chi passeggia ──
  let tu=avatar(citta); S.add(tu); tu.position.set(0,0,49); tu.rotation.y=Math.PI;
  function rivestiTu(){ const p=tu.position.clone(), r=tu.rotation.y; S.remove(tu); tu=avatar(citta); tu.position.copy(p); tu.rotation.y=r; S.add(tu); }
  rivesti=rivestiTu;
  const passanti=[]; const vv=Object.keys(VESTITI);
  for(let i=0;i<7;i++){ const p=avatar({vestito:vv[(i*3+1)%vv.length],pelle:i%5,colore:i===2?0x8E44AD:undefined});
    const a=i/7*Math.PI*2; p.position.set(Math.sin(a)*12,0,Math.cos(a)*12); S.add(p); passanti.push({m:p,meta:null,attesa:Math.random()*3}); }

  // ── muoversi ──
  const stato={yaw:0,pitch:0.38,dist:8,jx:0,jy:0,tasti:{},meta:null,metaId:null,fermoDa:0,ultimaPos:new THREE.Vector3(),modo:"cammina",spin:0};
  function spingiFuori(p,raggio){
    for(const s of solidi){
      if(s.cerchio){ const dx=p.x-s.x, dz=p.z-s.z, d=Math.hypot(dx,dz), m=s.r+raggio; if(d<m && d>1e-4){ p.x=s.x+dx/d*m; p.z=s.z+dz/d*m; } continue; }
      const c=Math.cos(s.rot), sn=Math.sin(s.rot), rx=p.x-s.x, rz=p.z-s.z;
      const lx=rx*c-rz*sn, lz=rx*sn+rz*c; const hw=s.w/2+raggio, hd=s.d/2+raggio;
      if(Math.abs(lx)<hw && Math.abs(lz)<hd){ let nx=lx, nz=lz; if(hw-Math.abs(lx)<hd-Math.abs(lz)) nx=Math.sign(lx||1)*hw; else nz=Math.sign(lz||1)*hd;
        p.x=s.x+nx*c+nz*sn; p.z=s.z-nx*sn+nz*c; }
    }
    const d=Math.hypot(p.x,p.z); if(d>50){ p.x*=50/d; p.z*=50/d; }
  }
  function percorso(k){
    const P=porte[k]; if(!P) return;
    const tappe=[]; let a={x:tu.position.x,z:tu.position.z};
    if(Math.hypot(a.x,a.z)>23.5){
      if(Math.abs(a.x)<3.6 && a.z>0){ a={x:0,z:20}; tappe.push(a); }   // dal viale si entra dal cancello
      else { const r=Math.hypot(a.x,a.z); tu.position.set(a.x/r*20,0,a.z/r*20); a={x:tu.position.x,z:tu.position.z}; } // dietro ai palazzi: si rientra in piazza
    }
    const b={x:P.x,z:P.z}, ux=b.x-a.x, uz=b.z-a.z, l2=ux*ux+uz*uz||1;
    const t=Math.max(0,Math.min(1,-(a.x*ux+a.z*uz)/l2)), cx=a.x+ux*t, cz=a.z+uz*t;
    if(Math.hypot(cx,cz)<3.8){ let nx=-uz, nz=ux; const nl=Math.hypot(nx,nz)||1; nx/=nl; nz/=nl;
      if(nx*(a.x+b.x)+nz*(a.z+b.z)<0){ nx=-nx; nz=-nz; } tappe.push({x:nx*5.5,z:nz*5.5}); }  // intorno all'albero
    tappe.push(b);
    stato.tappe=tappe.map(q=>new THREE.Vector3(q.x,0,q.z)); stato.meta=stato.tappe.shift(); stato.metaId=k; stato.fermoDa=0; stato.distPrima=Infinity;
  }
  scena.vaiVerso=id=>percorso(id==="lotto"?"lotto0":id);
  scena.modo=m=>{ stato.modo=m; if(m==="sartoria"){ const d=Math.hypot(tu.position.x,tu.position.z)||1; stato.spinBase=Math.atan2(-tu.position.x/d,-tu.position.z/d); stato.spin=0; } };
  scena.dove=()=>({x:tu.position.x,z:tu.position.z});
  scena.nelMuro=()=>solidi.some(s=>{ if(s.cerchio) return Math.hypot(tu.position.x-s.x,tu.position.z-s.z)<s.r;
    const c=Math.cos(s.rot), sn=Math.sin(s.rot), rx=tu.position.x-s.x, rz=tu.position.z-s.z;
    return Math.abs(rx*c-rz*sn)<s.w/2 && Math.abs(rx*sn+rz*c)<s.d/2; });
  scena.porte=porte;

  // il cerchio per camminare
  const joy=$("joy"), pomo=$("pomo"); let joyId=null;
  const muoviJoy=e=>{ const r=joy.getBoundingClientRect(); let x=(e.clientX-r.left-r.width/2)/(r.width/2), y=(e.clientY-r.top-r.height/2)/(r.height/2);
    const l=Math.hypot(x,y); if(l>1){ x/=l; y/=l; } stato.jx=x; stato.jy=y; pomo.style.transform=`translate(${x*36}px,${y*36}px)`; };
  joy.addEventListener("pointerdown",e=>{ joyId=e.pointerId; joy.setPointerCapture(e.pointerId); muoviJoy(e); stato.meta=null; nascondiAiuto(); e.preventDefault(); });
  joy.addEventListener("pointermove",e=>{ if(e.pointerId===joyId) muoviJoy(e); });
  const lascia=e=>{ if(e.pointerId!==joyId) return; joyId=null; stato.jx=stato.jy=0; pomo.style.transform=""; };
  joy.addEventListener("pointerup",lascia); joy.addEventListener("pointercancel",lascia);
  // trascinare per guardarsi intorno; un tocco breve su un palazzo ci porta davanti
  const sguardi=new Map(); const ray=new THREE.Raycaster(), v2=new THREE.Vector2();
  tela3d.addEventListener("pointerdown",e=>{ sguardi.set(e.pointerId,{x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,t:performance.now()}); try{ tela3d.setPointerCapture(e.pointerId); }catch(_){} });
  tela3d.addEventListener("pointermove",e=>{ const s=sguardi.get(e.pointerId); if(!s) return;
    stato.yaw-=(e.clientX-s.x)*0.0065; stato.pitch=Math.min(0.95,Math.max(0.08,stato.pitch+(e.clientY-s.y)*0.004)); s.x=e.clientX; s.y=e.clientY;
    if(Math.hypot(e.clientX-s.x0,e.clientY-s.y0)>12) nascondiAiuto(); });
  const fineSguardo=e=>{ const s=sguardi.get(e.pointerId); sguardi.delete(e.pointerId); if(!s || e.type==="pointercancel") return;
    if(Math.hypot(e.clientX-s.x0,e.clientY-s.y0)<10 && performance.now()-s.t<400){
      if(fogliAperto){ chiudiFoglio(); return; }
      v2.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(v2,cam);
      const colpi=ray.intersectObjects(toccabili.map(t=>t[0]),true);
      if(colpi.length){ let o=colpi[0].object; const t=toccabili.find(t=>t[0]===o||(t[0].getObjectById&&t[0].getObjectById(o.id))); if(t) percorso(t[1]); } } };
  tela3d.addEventListener("pointerup",fineSguardo); tela3d.addEventListener("pointercancel",fineSguardo);
  addEventListener("keydown",e=>{ stato.tasti[e.key.toLowerCase()]=true; });
  addEventListener("keyup",e=>{ stato.tasti[e.key.toLowerCase()]=false; });
  let aiutoVia=false; function nascondiAiuto(){ if(aiutoVia) return; aiutoVia=true; $("aiuto").style.opacity="0"; setTimeout(()=>$("aiuto").hidden=true,700); }
  setTimeout(nascondiAiuto,9000);

  $("entra").addEventListener("click",()=>{ const id=$("entra").dataset.id; if(id) apriFoglio(id); });

  function ridimensiona(){ renderer.setSize(innerWidth,innerHeight,false); cam.aspect=innerWidth/innerHeight; cam.fov=innerHeight>innerWidth?68:58; cam.updateProjectionMatrix(); }
  addEventListener("resize",ridimensiona);

  const orologio=new THREE.Clock(); const dir=new THREE.Vector3(), bersaglio=new THREE.Vector3(), ideale=new THREE.Vector3();
  let vicinoPrima=null;
  function passo(){
    const dt=Math.min(orologio.getDelta(),0.2), t=orologio.elapsedTime; // anche a pochi fotogrammi si cammina alla velocità giusta
    // input
    let mx=stato.jx, my=stato.jy; const T=stato.tasti;
    if(T["w"]||T["arrowup"]) my=-1; if(T["s"]||T["arrowdown"]) my=1; if(T["a"]||T["arrowleft"]) mx=-1; if(T["d"]||T["arrowright"]) mx=1;
    const fx=-Math.sin(stato.yaw), fz=-Math.cos(stato.yaw);
    let vx=fx*(-my)+(-fz)*mx, vz=fz*(-my)+fx*mx; let vel=0;
    const libero=!fogliAperto || fogliAperto==="vai";
    if(stato.modo==="sartoria"){ vx=vz=0; }
    else if((Math.abs(mx)>0.05||Math.abs(my)>0.05) && libero){ const l=Math.hypot(vx,vz); vel=5.2*Math.min(1,l); vx/=l; vz/=l; stato.meta=null; }
    else if(stato.meta && libero){ const dx=stato.meta.x-tu.position.x, dz=stato.meta.z-tu.position.z, d=Math.hypot(dx,dz);
      if(d<0.5 && stato.tappe && stato.tappe.length){ stato.meta=stato.tappe.shift(); stato.distPrima=Infinity; }
      else if(d<0.5){ const P=porte[stato.metaId]; stato.meta=null; tu.rotation.y=P.guarda; apriFoglio(P.id); }
      else { vx=dx/d; vz=dz/d; vel=Math.min(7.5,d*3+1);
        stato.fermoDa+=dt; if(stato.fermoDa>0.8){ if(stato.distPrima-d<0.3){ tu.position.set(stato.meta.x,0,stato.meta.z); } stato.distPrima=d; stato.fermoDa=0; } // incastrato: si salta alla tappa
        // la telecamera gira dolce dietro a dove vai
        const ya=Math.atan2(-vx,-vz); let dy=ya-stato.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); stato.yaw+=dy*Math.min(1,dt*2.2); } }
    if(vel>0){ tu.position.x+=vx*vel*dt; tu.position.z+=vz*vel*dt; spingiFuori(tu.position,0.45);
      const ry=Math.atan2(vx,vz); let dr=ry-tu.rotation.y; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); tu.rotation.y+=dr*Math.min(1,dt*12); cammina(tu,vel*dt*1.9); }
    else fermo(tu);

    // chi passeggia
    for(const p of passanti){
      if(!p.meta){ p.attesa-=dt; fermo(p.m); if(p.attesa<=0){ const a=Math.random()*Math.PI*2, r=4+Math.random()*13; p.meta=new THREE.Vector3(Math.sin(a)*r,0,Math.cos(a)*r); } continue; }
      const dx=p.meta.x-p.m.position.x, dz=p.meta.z-p.m.position.z, d=Math.hypot(dx,dz);
      if(d<0.3){ p.meta=null; p.attesa=1+Math.random()*4; continue; }
      p.m.position.x+=dx/d*1.4*dt; p.m.position.z+=dz/d*1.4*dt; spingiFuori(p.m.position,0.4);
      const ry=Math.atan2(dx,dz); let dr=ry-p.m.rotation.y; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); p.m.rotation.y+=dr*Math.min(1,dt*6); cammina(p.m,1.4*dt*1.9);
    }

    // vicino a una porta?
    let vicino=null, dmin=3.3;
    for(const [k,P] of Object.entries(porte)){ const d=Math.hypot(P.x-tu.position.x,P.z-tu.position.z); if(d<dmin){ dmin=d; vicino=P.id; } }
    if(vicino!==vicinoPrima){ vicinoPrima=vicino; const b=$("entra");
      if(vicino && !fogliAperto){ b.dataset.id=vicino; b.textContent=(vicino==="albero"?"Guarda · ":vicino==="lotto"?"Guarda · ":"Entra · ")+LUOGHI[vicino].nome; b.hidden=false; } else b.hidden=true; }
    if(fogliAperto && !$("entra").hidden) $("entra").hidden=true;
    if(!fogliAperto && vicino && $("entra").hidden){ vicinoPrima=null; }

    // la telecamera
    if(stato.modo==="sartoria"){ stato.spin+=dt*0.5; const a=stato.spinBase+Math.sin(stato.spin)*0.5;
      ideale.set(tu.position.x+Math.sin(a)*5, 1.4, tu.position.z+Math.cos(a)*5);
      tu.rotation.y=Math.atan2(ideale.x-tu.position.x,ideale.z-tu.position.z)+Math.sin(stato.spin*1.7)*0.6;
      bersaglio.set(tu.position.x,-0.5,tu.position.z); } // il bersaglio sotto i piedi: l'avatar sale nella metà alta, sopra il foglio
    else { const cp=Math.cos(stato.pitch); let dist=stato.dist;
      bersaglio.set(tu.position.x,1.6,tu.position.z);
      dir.set(Math.sin(stato.yaw)*cp, Math.sin(stato.pitch), Math.cos(stato.yaw)*cp).normalize();
      ray.set(bersaglio,dir); ray.far=dist; const muro=ray.intersectObjects(muri,false); if(muro.length) dist=Math.max(1.2,muro[0].distance-0.4);
      ideale.copy(bersaglio).addScaledVector(dir,dist); ray.far=Infinity; }
    cam.position.lerp(ideale, Math.min(1,dt*(stato.modo==="sartoria"?4:9))); cam.lookAt(bersaglio);

    if(scena._globo){ scena._globo.rotation.y+=dt*0.35; scena._globo.position.y=36+Math.sin(t*0.8)*0.4; }
    if(scena._chioma){ scena._chioma.rotation.y+=dt*0.04; }
    if(scena._oro){ const s=1+Math.sin(t*3)*0.18; scena._oro.scale.setScalar(s); }
    renderer.render(S,cam);
  }
  // si disegna solo se la pagina si vede
  let fotogrammi=0;
  renderer.setAnimationLoop(()=>{ if(document.hidden) return; passo(); fotogrammi++; if(fotogrammi===2) $("carica").classList.add("via"); });
  scena.pronta=true; scena.fotogrammi=()=>fotogrammi;
}
let rivesti=()=>{};

costruisci().catch(e=>{ console.error(e); riserva("La città non è riuscita a partire su questo telefono."); });
</script>
