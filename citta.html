<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>La città di JJA-VIS</title>
<meta name="description" content="Entra nella città di JJA-VIS: la piazza, i quartieri, la reception, la bottega coi prodotti già pronti, il ristorante, la palestra, la sartoria per vestire il tuo avatar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Mono&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Il tema di JARVIS, lo stesso della pagina (index.html) */
:root{
  --bg:#020B18; --panel:#030E1E; --bordo:#0D3A5C; --accento:#00B4D8; --accento2:#0077B6;
  --testo:#CAF0F8; --tenue:#48CAE4; --oro:#FFD60A; --input:#020D1A;
  --f-titoli:"Archivo",system-ui,sans-serif; --f-testo:"DM Sans",system-ui,sans-serif; --f-mono:"DM Mono",ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#020B18}}
:root[data-theme="dark"]{--bg:#020B18}
/* I QUATTRO ASPETTI della pagina (index.html), solo i colori: l'aspetto scelto nella pagina
   colora anche la città, le sfere comprese (JJ, 3/10). Copia sorvegliata: collaudo/citta.py la confronta */
:root[data-tema="calmo"]{--bg:#0B0B1A;--panel:#12122A;--bordo:#2A2A55;--accento:#8B8CF8;--accento2:#6366F1;--testo:#E6E6FF;--tenue:#A5A6E0;--utente:#1C1C45;--oro:#F0ABFC;--input:#0D0D22}
:root[data-tema="deciso"]{--bg:#0E0E0E;--panel:#181818;--bordo:#2E2E2E;--accento:#FF5A1F;--accento2:#C2410C;--testo:#F4F4F4;--tenue:#B8B8B8;--utente:#2A1A12;--oro:#FFC53D;--input:#111111}
:root[data-tema="naturale"]{--bg:#08130E;--panel:#0E1C16;--bordo:#21402F;--accento:#34D399;--accento2:#059669;--testo:#E7F5EC;--tenue:#9CC9AE;--utente:#123526;--oro:#FBBF24;--input:#0A1712}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--testo);font:500 16px/1.4 var(--f-testo);
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scena{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
a{color:var(--accento)}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px}

.cornice{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bordo);position:relative}
.cornice::before{content:"";position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--accento);border-left:2px solid var(--accento)}
.cornice::after{content:"";position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--accento);border-right:2px solid var(--accento)}

/* in alto: il nome della città, i numeri veri, il giro */
.hud{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.hud>*{pointer-events:auto}
.pulsanti-hud{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#cartello{padding:9px 13px 10px;max-width:calc(100% - 110px)}
.titolo{font:800 19px/1.1 var(--f-titoli);letter-spacing:.03em;text-shadow:0 0 14px color-mix(in srgb,var(--accento) 50%,transparent)}
.sotto{font:400 12px/1.35 var(--f-mono);color:var(--tenue);margin-top:4px}
.sotto b{color:var(--oro);font-weight:400}
#giro{margin-top:8px;display:flex;align-items:center;gap:7px;font:500 13px/1.2 var(--f-testo);color:var(--testo);background:none;border:0;padding:0;cursor:pointer;text-align:left}
#giro .f{width:11px;height:11px;border:2px solid var(--accento);border-radius:50%;flex:none}
#giro .f.fatta{background:var(--accento);box-shadow:0 0 8px var(--accento)}
.pulsante{font:700 14px/1 var(--f-testo);color:var(--testo);background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--bordo);
  padding:11px 13px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pulsante:active{border-color:var(--accento)}

/* in basso: joystick, Vai a…, Entra */
#joy{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:124px;height:124px;border-radius:50%;z-index:6;
  background:color-mix(in srgb,var(--panel) 55%,transparent);border:1px solid var(--bordo);touch-action:none}
#pomo{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:color-mix(in srgb,var(--testo) 85%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--accento) 60%,transparent)}
#vai{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);z-index:6;padding:14px 16px;font-size:16px}
#entra{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);z-index:6;
  font:800 18px/1 var(--f-titoli);letter-spacing:.02em;color:var(--bg);background:var(--accento);border:0;padding:15px 22px;cursor:pointer;
  box-shadow:0 0 22px color-mix(in srgb,var(--accento) 60%,transparent);max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#entra[hidden]{display:none}
#aiuto{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 160px);z-index:5;
  font:400 13px/1.35 var(--f-mono);color:var(--tenue);text-align:center;padding:8px 12px;max-width:300px;pointer-events:none;transition:opacity .6s}

/* il foglio che sale dal basso quando entri */
#foglio{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:72vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px);border-bottom:0;transform:translateY(105%);transition:transform .32s ease-out;
  -webkit-user-select:text;user-select:text;touch-action:pan-y}
#foglio.aperto{transform:none}
#foglio:not(.aperto){pointer-events:none}
body.con-foglio .hud,body.con-foglio #joy,body.con-foglio #vai{opacity:0;pointer-events:none}
.hud,#joy,#vai{transition:opacity .25s}
body.in-sartoria #foglio{max-height:56vh} /* sopra si deve vedere l'avatar intero */ /* mentre scende non deve rubare il tocco al cerchio */
@media (prefers-reduced-motion:reduce){#foglio{transition:none}}
#foglio .dentro{max-width:560px;margin:0 auto}
#foglio h2{font:800 28px/1.05 var(--f-titoli);margin:0 32px 6px 0}
#foglio .eti{font:400 12px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);margin:0 0 6px}
#foglio p{margin:0 0 12px;font-size:17px;line-height:1.45}
#foglio .piccolo{font-size:14px;color:var(--tenue)}
#chiudi{position:absolute;top:10px;right:10px;width:42px;height:42px;font:400 26px/1 var(--f-testo);color:var(--testo);background:none;border:1px solid var(--bordo);cursor:pointer}
.azioni{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.vai-pagina{font:700 16px/1 var(--f-testo);color:var(--bg);background:var(--accento);border:0;padding:13px 16px;text-decoration:none;display:inline-block}
.vai-pagina.seconda{background:none;color:var(--testo);border:1px solid var(--bordo)}
.prodotto{border:1px solid var(--bordo);padding:12px 13px;margin:0 0 10px;background:color-mix(in srgb,var(--accento) 4%,transparent)}
.prodotto h3{font:800 20px/1.1 var(--f-titoli);margin:0 0 6px}
.prodotto p{font-size:15px!important;margin:0 0 10px!important}
.prodotto.tuo{border-color:var(--oro);box-shadow:0 0 14px color-mix(in srgb,var(--oro) 25%,transparent) inset}
.badge{display:inline-block;font:400 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--bg);background:var(--oro);padding:4px 6px;margin:0 0 7px}
.sezione{font:700 15px/1.2 var(--f-testo);margin:16px 0 8px;color:var(--testo)}
.scelte{display:flex;flex-wrap:wrap;gap:7px}
.scelta{font:600 15px/1 var(--f-testo);padding:10px 12px;border:1px solid var(--bordo);background:color-mix(in srgb,var(--accento) 5%,transparent);color:var(--testo);cursor:pointer}
.scelta[aria-pressed="true"]{background:#0D2A3E;border-color:var(--accento);box-shadow:0 0 10px color-mix(in srgb,var(--accento) 35%,transparent) inset}
.tinte{display:flex;flex-wrap:wrap;gap:9px}
.tinta{width:38px;height:38px;border:2px solid var(--bordo);cursor:pointer;padding:0}
.tinta[aria-pressed="true"]{border-color:var(--oro);box-shadow:0 0 0 2px var(--bg) inset}
.tinta.originale{background:repeating-linear-gradient(45deg,#0D3A5C 0 6px,#030E1E 6px 12px)}
.elenco-vai button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;font:600 17px/1.2 var(--f-testo);color:var(--testo);
  background:none;border:0;border-bottom:1px solid var(--bordo);padding:13px 4px;cursor:pointer}
.elenco-vai small{display:block;font:400 13px/1.3 var(--f-mono);color:var(--tenue);margin-top:3px}
.elenco-vai .ic{font-size:22px;width:30px;text-align:center;flex:none}

/* la stanza: sopra l'interno in 3D, sotto la scheda lunga */
#stanza{position:fixed;inset:0;z-index:26;display:flex;flex-direction:column;pointer-events:none}
#stanza[hidden]{display:none}
.stanza-barra{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 6px}
#stanza-nome{font:400 12px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);text-shadow:0 1px 4px #000}
.stanza-vista{flex:0 0 34vh}
#stanza-carta{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;pointer-events:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 28px);
  border-bottom:0;transform:translateY(30px);opacity:0;transition:transform .28s ease-out,opacity .28s;-webkit-user-select:text;user-select:text;touch-action:pan-y;
  background:color-mix(in srgb,var(--panel) 96%,transparent)}
#stanza.aperta #stanza-carta{transform:none;opacity:1}
@media (prefers-reduced-motion:reduce){#stanza-carta{transition:none}}
#stanza-carta .dentro{max-width:560px;margin:0 auto}
#stanza h2{font:800 32px/1.05 var(--f-titoli);margin:0 0 8px}
#stanza .eti{font:400 12px/1.3 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);margin:0 0 6px}
#stanza .intro{font-size:18px;line-height:1.45;margin:0 0 14px}
#stanza p{margin:0 0 12px;font-size:16px;line-height:1.5}
#stanza .piccolo{font-size:14px;color:var(--tenue)}
#stanza h3{font:800 20px/1.15 var(--f-titoli);margin:0 0 10px;color:var(--testo)}
.blocco{border-top:1px solid var(--bordo);padding:16px 0 4px;margin-top:6px}
.blocco.prodotto{border:1px solid var(--bordo);padding:14px 13px 6px;margin:0 0 12px;background:color-mix(in srgb,var(--accento) 4%,transparent)}
.blocco.prodotto.tuo{border-color:var(--oro);box-shadow:0 0 14px color-mix(in srgb,var(--oro) 25%,transparent) inset}
.lista,.passi{margin:0 0 12px;padding-left:22px}
.lista li,.passi li{margin:0 0 8px;line-height:1.45}
.passi li::marker{color:var(--accento);font-weight:800}
.fatti{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:4px 0 14px}
.fatto{border:1px solid var(--bordo);padding:10px 11px;background:color-mix(in srgb,var(--accento) 5%,transparent)}
.fatto b{display:block;font:800 26px/1.05 var(--f-titoli);color:var(--accento)}
.fatto span{display:block;font-size:13px;line-height:1.35;color:var(--tenue);margin-top:4px}
.carte{display:grid;gap:8px;margin:0 0 12px}
.carta{border:1px solid var(--bordo);padding:11px 12px}
.carta b{display:block;font:800 17px/1.2 var(--f-titoli)}
.carta em{display:block;font:400 11px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--oro);font-style:normal;margin-top:3px}
.carta span{display:block;font-size:15px;line-height:1.45;margin-top:5px}
.elenco-video{display:grid;gap:8px;margin-bottom:10px}
.video{display:block;border:1px solid var(--bordo);padding:11px 12px;text-decoration:none;color:var(--testo)}
.video b{display:block;font-weight:700}
.video span{display:block;font:400 13px/1.3 var(--f-mono);color:var(--accento);margin-top:4px}
/* dentro si cammina: restano il cerchio e «Usa»; quando sale la carta, spariscono anche loro */
body.in-stanza .hud,body.in-stanza #vai,body.in-stanza #aiuto{opacity:0;pointer-events:none}
body.in-stanza.con-carta #joy,body.in-stanza.con-carta #entra{opacity:0;pointer-events:none}
#stanza:not(.con-carta) #stanza-carta{display:none}
#stanza:not(.con-carta) .stanza-vista{display:none}
.stanza-barra .spazio{flex:1}
/* la barra in alto è piena: le etichette delle cose non ci passano dietro */
.stanza-barra{background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--bordo)}
/* Nova in città: la stessa chat della pagina, senza uscire */
.apri-nova{position:relative}
.apri-nova .nuovo{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--oro);box-shadow:0 0 8px var(--oro)}
.apri-nova .nuovo[hidden]{display:none}
#nova{position:fixed;left:0;right:0;bottom:0;top:22vh;z-index:40;display:flex;flex-direction:column;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 12px);
  border-bottom:0;background:var(--panel);-webkit-user-select:text;user-select:text}
#nova[hidden]{display:none}
#nova .testa-nova{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#nova .testa-nova b{font:800 22px/1.1 var(--f-titoli);flex:1}
#nova .testa-nova small{display:block;font:400 12px/1.3 var(--f-mono);color:var(--tenue);letter-spacing:.06em}
#chiudi-nova{width:42px;height:42px;font:400 26px/1 var(--f-testo);color:var(--testo);background:transparent;border:1px solid var(--bordo);cursor:pointer}
#nova-chat{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:4px 2px;touch-action:pan-y}
#nova .bolla{max-width:86%;padding:10px 12px;font-size:16px;line-height:1.45;border:1px solid var(--bordo);white-space:pre-wrap}
#nova .bolla.tu{align-self:flex-end;background:var(--utente,#0D2A3E)}
#nova .bolla.io{align-self:flex-start;background:color-mix(in srgb,var(--accento) 7%,transparent)}
#nova .bolla small.attesa{display:block;margin-top:5px;font:400 12px/1.2 var(--f-mono);color:var(--tenue)}
#nova .bolla a{display:inline-block;margin-top:8px;font-weight:700}
#nova .vuota{color:var(--tenue);font-size:15px;line-height:1.45}
#nova .scrivi{display:flex;gap:8px;margin-top:10px}
#nova textarea{flex:1;min-height:48px;max-height:120px;resize:none;font:500 16px/1.35 var(--f-testo);color:var(--testo);background:var(--input);border:1px solid var(--bordo);padding:12px}
#nova .manda{font:800 16px/1 var(--f-titoli);color:var(--bg);background:var(--accento);border:0;padding:0 18px;cursor:pointer}
#nova .manda:disabled{opacity:.5}
#esito-nova{font-size:14px;color:var(--tenue);margin-top:6px;min-height:1em}
#esito-nova.errore{color:#ff8080}
body.con-nova #joy,body.con-nova #entra,body.con-nova #vai{opacity:0;pointer-events:none}
#chiudi-carta{position:sticky;top:0;float:right;margin:-6px -4px 0 8px;width:42px;height:42px;font:400 26px/1 var(--f-testo);color:var(--testo);
  background:var(--panel);border:1px solid var(--bordo);cursor:pointer;z-index:2}
.menu-voce{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bordo);padding:10px 0}
.menu-voce .nome{flex:1;font-size:16px;line-height:1.3}
.menu-voce .prezzo{font:400 14px/1 var(--f-mono);color:var(--tenue);min-width:62px;text-align:right}
.qta{display:flex;align-items:center;gap:6px}
.qta button{width:36px;height:36px;font:700 20px/1 var(--f-testo);color:var(--testo);background:none;border:1px solid var(--bordo);cursor:pointer}
.qta b{min-width:20px;text-align:center;font:700 16px/1 var(--f-mono)}
.totale{display:flex;justify-content:space-between;align-items:baseline;font:800 22px/1.2 var(--f-titoli);margin:14px 0 10px}
.vai-pagina:disabled{opacity:.4;cursor:default}
.avviso{border:1px solid var(--oro);padding:12px 13px;margin:6px 0 12px;background:color-mix(in srgb,var(--oro) 8%,transparent)}
.domanda{margin:0 0 14px}
.domanda p{font-weight:700;margin:0 0 8px!important}

/* l'ingresso */
#carica{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse 70% 50% at 50% 45%,#06223a,var(--bg));transition:opacity .5s}
#carica.via{opacity:0;pointer-events:none}
.sfera{width:120px;height:120px;border-radius:50%;border:2px solid var(--accento);
  background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--accento) 45%,transparent),transparent 60%);
  box-shadow:0 0 40px color-mix(in srgb,var(--accento) 45%,transparent),inset 0 0 30px color-mix(in srgb,var(--accento) 35%,transparent);
  animation:batte 1.6s ease-in-out infinite}
@keyframes batte{50%{transform:scale(1.06);box-shadow:0 0 60px color-mix(in srgb,var(--accento) 65%,transparent),inset 0 0 30px color-mix(in srgb,var(--accento) 35%,transparent)}}
@media (prefers-reduced-motion:reduce){.sfera{animation:none}}
#carica .titolo{font-size:26px}
.barra{width:220px;height:6px;background:var(--bordo);overflow:hidden}
.barra i{display:block;height:100%;width:30%;background:var(--accento);animation:scorre 1.2s linear infinite}
@keyframes scorre{from{transform:translateX(-100%)}to{transform:translateX(340%)}}

/* senza 3D: la città diventa un elenco, e funziona lo stesso */
#riserva{position:fixed;inset:0;z-index:25;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 40px;background:var(--bg);-webkit-user-select:text;user-select:text}
#riserva[hidden]{display:none}
#riserva .dentro{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<canvas id="scena" aria-label="La città di JJA-VIS in 3D: muoviti col cerchio in basso a sinistra, trascina per guardarti intorno"></canvas>

<div class="hud">
  <div id="cartello" class="cornice">
    <div class="titolo">La città di JJA-VIS</div>
    <div class="sotto" id="numeri">il tuo assistente, in carne e palazzi</div>
    <button id="giro" type="button" aria-label="Il tuo primo giro"></button>
  </div>
  <div class="pulsanti-hud"><button class="pulsante apri-nova" type="button" id="apri-nova">💬 <span class="nome-nova">Nova</span><i class="nuovo" hidden></i></button>
  <a class="pulsante" href="index.html" id="esci">← La pagina</a></div>
</div>

<div id="joy" aria-hidden="true"><div id="pomo"></div></div>
<button id="vai" class="pulsante" type="button">☰ Vai a…</button>
<button id="entra" type="button" hidden></button>
<div id="aiuto" class="cornice">Muoviti col cerchio · trascina per guardarti intorno · tocca un palazzo per andarci. Dentro, tocca le cose</div>

<section id="foglio" class="cornice" role="dialog" aria-modal="false" aria-labelledby="foglio-titolo" aria-hidden="true">
  <button id="chiudi" type="button" aria-label="Chiudi">×</button>
  <div class="dentro" id="foglio-dentro"></div>
</section>

<section id="stanza" hidden aria-hidden="true" role="dialog" aria-labelledby="stanza-titolo">
  <div class="stanza-barra"><button id="esci-stanza" class="pulsante" type="button">← Esci</button><span id="stanza-nome"></span><span class="spazio"></span><button class="pulsante apri-nova" type="button" id="apri-nova-stanza" aria-label="Parla col tuo assistente">💬<i class="nuovo" hidden></i></button><button id="apri-scheda" class="pulsante" type="button">📋 Scheda</button></div>
  <div class="stanza-vista" aria-hidden="true"></div>
  <div id="stanza-carta" class="cornice"><button id="chiudi-carta" type="button" aria-label="Chiudi e cammina">×</button><div class="dentro" id="stanza-dentro"></div></div>
</section>

const testForma={risposte:[]};
let livelloMostrato=null;
function provaForma(){
  const out=[]; const rifai=()=>ridisegnaCarta();
  if(citta.forma && !testForma.rifai){
    out.push(FATTI([[LIVELLI[citta.forma.livello],"il tuo livello, dalle tue risposte"],[citta.forma.punti+" / 12","il punteggio del test"]]));
    out.push(NOTA(`Fatto il ${citta.forma.data.split("-").reverse().join("/")}. È una stima dalle tue risposte, non una misura.`));
    out.push(AZIONI(bottone("I miei esercizi",()=>{ livelloMostrato=citta.forma.livello; apriCosa("esercizi"); }), bottone("Rifai il test",()=>{ testForma.rifai=true; testForma.risposte=[]; rifai(); },true)));
    return out;
  }
  out.push(P("Quattro domande. Rispondi com'è oggi, non come vorresti: il livello serve a darti gli esercizi giusti."));
  TEST_FORMA.forEach(([d,scelte],i)=>{ const g=el("div",{class:"scelte",role:"group","aria-label":d});
    scelte.forEach((t,v)=>{ const b=el("button",{class:"scelta",type:"button","aria-pressed":String(testForma.risposte[i]===v),testo:t,"data-domanda":String(i),"data-valore":String(v)});
      b.addEventListener("click",()=>{ testForma.risposte[i]=v; rifai(); }); g.append(b); });
    out.push(el("div",{class:"domanda"}, P(`${i+1}. ${d}`), g)); });
  const tutte=TEST_FORMA.every((_,i)=>Number.isInteger(testForma.risposte[i]));
  const fine=bottone("Calcola il mio livello",()=>{
    const punti=testForma.risposte.reduce((a,b)=>a+b,0), d=new Date();
    citta.forma={livello:livelloDa(punti), punti, data:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
    salva(); testForma.rifai=false; testForma.risposte=[]; livelloMostrato=citta.forma.livello; rifai(); });
  if(!tutte) fine.disabled=true;
  out.push(AZIONI(fine));
  return out;
}
function esercizi(){
  const liv=livelloMostrato||(citta.forma&&citta.forma.livello)||"principiante";
  const out=[];
  const g=el("div",{class:"scelte",role:"group","aria-label":"Livello"});
  Object.entries(LIVELLI).forEach(([k,t])=>{ const b=el("button",{class:"scelta",type:"button","aria-pressed":String(liv===k),testo:t+(citta.forma&&citta.forma.livello===k?" · il tuo":"")});
    b.addEventListener("click",()=>{ livelloMostrato=k; ridisegnaCarta(); }); g.append(b); });
  out.push(g);
  if(!citta.forma) out.push(NOTA("Non hai ancora fatto il test di forma: ti mostro il livello Principiante. Il test è alla bilancia."));
  out.push(el("div",{class:"carte",id:"elenco-esercizi","data-livello":liv}, ...ESERCIZI[liv].map(([n,dose,come])=>el("div",{class:"carta"}, el("b",{testo:n}), el("em",{testo:dose}), el("span",{testo:come})))));
  out.push(NOTA("Riposa un minuto fra una serie e l'altra. Due o tre volte a settimana, a giorni alterni."));
  return out;
}

// La Sartoria, allo specchio: il mestiere serve a me, il vestito è tuo.
let mestiereDaCambiare=false;
function specchio(){
  const out=[];
  const rifai=()=>{ salva(); rivesti(); ridisegnaCarta(); };
  const mest=el("div",{class:"scelte",role:"group","aria-label":"Che lavoro fai"});
  MESTIERI.forEach(([m])=>{ const b=el("button",{class:"scelta",type:"button","aria-pressed":String(citta.mestiere===m),testo:m});
    b.addEventListener("click",()=>{ citta.mestiere=m; if(!citta.vestitoScelto) citta.vestito=vestitoDi(m); rifai(); }); mest.appendChild(b); });
  // JJ, 3/10: «se ho già detto che lavoro faccio non c'è bisogno che lo devo scegliere ancora»
  if(io.mestiere && citta.mestiere===io.mestiere && !mestiereDaCambiare){
    const cambia=bottone("Cambia",()=>{ mestiereDaCambiare=true; ridisegnaCarta(); },true);
    out.push(el("div",{class:"sezione",testo:"Il tuo lavoro"}), el("p",{id:"mestiere-detto",testo:`${io.mestiere}: me l'hai già detto nella pagina.`}), AZIONI(cambia));
  } else out.push(el("div",{class:"sezione",testo:"Che lavoro fai?"}), mest);
  const vest=el("div",{class:"scelte",role:"group","aria-label":"Come ti vesti"});
  Object.entries(VESTITI).forEach(([k,v])=>{ const b=el("button",{class:"scelta",type:"button","aria-pressed":String(citta.vestito===k),testo:v.nome});
    b.addEventListener("click",()=>{ citta.vestito=k; citta.vestitoScelto=true; rifai(); }); vest.appendChild(b); });
  out.push(el("div",{class:"sezione",testo:"Come ti vesti?"}), vest);
  const tin=el("div",{class:"tinte",role:"group","aria-label":"Colore"});
  TINTE.forEach(t=>{ const b=el("button",{class:"tinta"+(t===null?" originale":""),type:"button","aria-label":t===null?"colore originale":"colore","aria-pressed":String((citta.colore??null)===t)});
    if(t!==null) b.style.background="#"+t.toString(16).padStart(6,"0");
    b.addEventListener("click",()=>{ citta.colore=t; rifai(); }); tin.appendChild(b); });
  out.push(el("div",{class:"sezione",testo:"Colore"}), tin);
  const pel=el("div",{class:"tinte",role:"group","aria-label":"Pelle"});
  PELLI.forEach((t,i)=>{ const b=el("button",{class:"tinta",type:"button","aria-label":"tono della pelle "+(i+1),"aria-pressed":String(citta.pelle===i)});
    b.style.background="#"+t.toString(16).padStart(6,"0"); b.addEventListener("click",()=>{ citta.pelle=i; rifai(); }); pel.appendChild(b); });
  out.push(el("div",{class:"sezione",testo:"Pelle"}), pel);
  return out;

// ── Nova in città (JJ, 3/10: «i pulsanti che ti fanno tornare in chat fuori dalla città, delle chat con Nova
// nella città che fa la stessa cosa ma dentro lì»). È LA STESSA chat della pagina: stessa porta (POST /parla,
// GET /risposte), stessa conversazione in jjavis-io.chat, così una risposta arrivata qui si ritrova nella pagina
// e viceversa. Della chiave della pagina la città scrive solo chat, chatDa e id (se manca, come lo fa la pagina):
// ogni scrittura rilegge la chiave fresca prima, per non cancellare quello che la pagina ha scritto nel frattempo.
const AZIONI_CHAT={commissione:["Te lo costruisco: chiedi un preventivo →","#costruisci"], sopralluogo:["Fammi fare un sopralluogo →","#sopralluogo"], clio:["Scopri Clio →","#clio"]};
const leggiIo=()=>{ try{ return JSON.parse(localStorage.getItem("jjavis-io")||"{}")||{}; }catch(_){ return {}; } };
function scriviIo(cambia){ const fresco=leggiIo(); cambia(fresco); try{ localStorage.setItem("jjavis-io",JSON.stringify(fresco)); }catch(_){} io=fresco; }
let novaAperta=false, novaParla=false, novaGiro=null, novaDa=0;
const novaAttesa=()=>(io.chat||[]).some(m=>m.ruolo==="tu"&&m.attesa);
function segnaNovita(){ const c=(io.chat||[]).some(m=>m.nuovo); document.querySelectorAll(".apri-nova .nuovo").forEach(x=>x.hidden=!c); }
function nomiNova(){ const n=nomeAssistente()||"Nova"; document.querySelectorAll(".nome-nova").forEach(x=>x.textContent=n); $("nova-titolo").textContent=n; }
function disegnaNova(){
  const c=$("nova-chat"); c.textContent="";
  if(!nomeAssistente()){ c.append(el("p",{class:"vuota",testo:"Prima dai un nome al tuo assistente: si fa nella pagina, in un minuto. Poi parlate anche da qui."}), AZIONI(vai(PAGINA+"#inizia","Dai un nome al tuo assistente")));
    $("nova-scrivi").disabled=true; $("nova-manda").disabled=true; return; }
  $("nova-scrivi").disabled=false; $("nova-manda").disabled=novaParla;
  const ch=io.chat||[];
  if(!ch.length) c.append(el("p",{class:"vuota",testo:`Scrivi a ${nomeAssistente()}. Quello che non sa lo passa a chi lo costruisce, e la risposta compare qui da sola.`}));
  ch.forEach(m=>{ const b=el("div",{class:"bolla "+(m.ruolo==="tu"?"tu":"io"),testo:m.testo});
    if(m.ruolo==="tu"&&m.attesa) b.append(el("small",{class:"attesa",testo:"ti rispondo appena posso"}));
    if(m.azione&&AZIONI_CHAT[m.azione.servizio]){ b.append(el("br")); b.append(vai(PAGINA+AZIONI_CHAT[m.azione.servizio][1],AZIONI_CHAT[m.azione.servizio][0])); }
    c.append(b); });
  c.scrollTop=c.scrollHeight;
  // mostrata = letta, come nella pagina
  if(ch.some(m=>m.nuovo)) scriviIo(f=>{ (f.chat||[]).forEach(m=>{ delete m.nuovo; }); if((f.chat||[]).length && !f.chatDa) f.chatDa=Date.now(); });
  segnaNovita();
}
function apriNova(spunto){
  io=leggiIo(); novaAperta=true; nomiNova(); $("nova").hidden=false; document.body.classList.add("con-nova");
  if(spunto && !$("nova-scrivi").value) $("nova-scrivi").value=spunto;
  disegnaNova(); if(novaAttesa()) controllaNova().then(giroNova);
}
function chiudiNova(){ novaAperta=false; $("nova").hidden=true; document.body.classList.remove("con-nova"); }
async function mandaNova(){
  const testo=$("nova-scrivi").value.trim(), e=$("esito-nova"); if(!testo||novaParla) return;
  e.className=""; e.textContent=""; novaParla=true; $("nova-manda").disabled=true;
  try{
    if(!leggiIo().id) scriviIo(f=>{ f.id=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join(""); });
    io=leggiIo();
    const r=await fetch(PORTA+"/parla",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chi:io.id, nome_assistente:io.nome||"", tema:io.tema||"tech", tuo:io.tuo||"", da_dove:"chat",
        profilo:{mestiere:io.mestiere||"", tempo:io.tempo||"", conosciute:io.conosciute||{}}, testo,
        ...(io.mail ? {contatto:{nome:io.tuo||"", societa:"", mail:io.mail, consenso:true}} : {})})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.id) throw new Error(d.errore||("errore "+r.status));
    const sub=d.subito;   // Nova ha già risposto
    scriviIo(f=>{ f.chat=f.chat||[]; f.chat.push({ruolo:"tu", testo, id:d.id, attesa:!sub || !!sub.passa});
      if(sub) f.chat.push({ruolo:"io", testo:sub.testo, id:sub.id, ...(sub.azione?{azione:sub.azione}:{})});
      f.chat=f.chat.slice(-20); if(!f.chatDa) f.chatDa=Date.now(); });
    $("nova-scrivi").value="";
    e.textContent = sub ? (sub.passa ? "Su questa ti risponde anche chi mi costruisce: la risposta compare qui da sola." : "") : "Arrivato. Ti rispondo qui appena posso: la risposta compare da sola.";
    novaDa=Date.now(); giroNova();
  }catch(err){ e.className="errore"; e.textContent="Non è partito: "+err.message+". Riprova tra poco."; }
  finally{ novaParla=false; disegnaNova(); }
}
// le risposte: stessa regola della pagina (quelle di conversazioni già archiviate non tornano)
async function controllaNova(){
  io=leggiIo(); if(!io.id) return 0;
  try{
    const r=await fetch(PORTA+"/risposte?chi="+encodeURIComponent(io.id)); if(!r.ok) return 0;
    const d=await r.json(); let nuove=0;
    scriviIo(f=>{ f.chat=f.chat||[];
      const archiviate=new Set((f.thread||[]).flatMap(c=>c.messaggi||[]).filter(m=>m.ruolo==="io").map(m=>m.id));
      (d.risposte||[]).forEach(x=>{
        if(archiviate.has(x.id) || f.chat.some(m=>m.ruolo==="io"&&m.id===x.id)) return;
        const i=f.chat.findIndex(m=>m.ruolo==="tu"&&(m.id===x.id||m.id+"-n"===x.id));
        const risp={ruolo:"io", testo:x.risposta, id:x.id, nuovo:true, ...(x.azione?{azione:x.azione}:{})};
        if(i>=0){ f.chat[i].attesa=false; f.chat.splice(i+1,0,risp); } else f.chat.push({ruolo:"tu", testo:x.domanda, id:x.id, attesa:false}, risp);
        nuove++; });
      if(nuove) f.chat=f.chat.slice(-20); });
    if(nuove){ if(novaAperta) disegnaNova(); else segnaNovita(); }
    return nuove;
  }catch(_){ return 0; }
}
function giroNova(){ clearTimeout(novaGiro); if(!novaAttesa()) return;
  const ogni=Date.now()-novaDa<10*60e3?20e3:60e3;
  novaGiro=setTimeout(async()=>{ if(!document.hidden) await controllaNova(); giroNova(); }, ogni); }

const MAT=new Map();
const mat=(c,emi)=>{ const k=c+"|"+(emi||0); if(!MAT.has(k)) MAT.set(k, emi? new THREE.MeshBasicMaterial({color:c}) : new THREE.MeshLambertMaterial({color:c})); return MAT.get(k); };
const GEO={};
const scatola=(w,h,d,c,emi)=>{ const k=`b${w},${h},${d}`; GEO[k]=GEO[k]||new THREE.BoxGeometry(w,h,d); return new THREE.Mesh(GEO[k], mat(c,emi)); };
const palla=(r,c,emi,seg=12)=>{ const k=`s${r},${seg}`; GEO[k]=GEO[k]||new THREE.SphereGeometry(r,seg,Math.max(6,seg*0.75|0)); return new THREE.Mesh(GEO[k], mat(c,emi)); };
const cilindro=(rt,rb,h,c,seg=10,emi)=>{ const k=`c${rt},${rb},${h},${seg}`; GEO[k]=GEO[k]||new THREE.CylinderGeometry(rt,rb,h,seg); return new THREE.Mesh(GEO[k], mat(c,emi)); };
const tela=(w,h)=>{ const c=document.createElement("canvas"); c.width=w; c.height=h; return c; };
const tex=c=>{ const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=2; return t; };

// ── l'avatar: lo stesso per te, per i passanti e per i manichini ──
function avatar(st){
  const v=VESTITI[st.vestito]||VESTITI.altro;
  const maglia=(typeof st.colore==="number")?st.colore:v.maglia;
  const pelle=PELLI[st.pelle??1]; const capelli=0x2b1d14;
  const g=new THREE.Group(); const gambe=[], braccia=[], tessuti=[];
  for(const s of [-1,1]){
    const p=new THREE.Group(); p.position.set(0.15*s,0.9,0);
    const l=scatola(0.22,0.82,0.24,st.vestito==="artigiano"&&typeof st.colore==="number"?maglia:v.pantaloni); l.position.y=-0.41; p.add(l);
    const sc=scatola(0.24,0.12,0.32,v.scarpe); sc.position.set(0,-0.85,0.04); p.add(sc);
    g.add(p); gambe.push(p);
  }
  const busto=scatola(0.56,0.7,0.32,maglia); busto.position.y=1.25; g.add(busto);
  for(const s of [-1,1]){
    const p=new THREE.Group(); p.position.set(0.37*s,1.55,0);
    const a=scatola(0.17,0.6,0.2,maglia); a.position.y=-0.29; p.add(a);
    const m=scatola(0.15,0.14,0.17,pelle); m.position.y=-0.66; p.add(m);
    g.add(p); braccia.push(p);
  }
  const collo=scatola(0.16,0.1,0.16,pelle); collo.position.y=1.64; g.add(collo);
  const testa=palla(0.24,pelle); testa.position.y=1.88; g.add(testa);
  for(const s of [-1,1]){ const o=scatola(0.05,0.06,0.02,0x111111); o.position.set(0.08*s,1.91,0.225); g.add(o); }
  let cappello=false;
  const add=(m,x,y,z)=>{ m.position.set(x,y,z); g.add(m); return m; };
  switch(st.vestito){
    case "corriere":{ cappello=true;

// Stoffa: una scatola con più divisioni, che parte da «alto» e scende di h. Ne teniamo la forma di riposo.
const ANCA=0.9;
// Un pannello di stoffa: x0..x1, y0..y1, z0..z1, con le colonne di punti in larghezza dove servono (i fianchi
// delle gambe e la striscia in mezzo, dove la stoffa si tende fra le due) e una riga ogni 10 cm in altezza.
function pannello(x0,x1,y0,y1,z0,z1){
  const xs=[x0,x1,-0.27,-0.04,-PONTE/2,0,PONTE/2,0.04,0.27].filter(v=>v>=x0-1e-9&&v<=x1+1e-9).sort((p,q)=>p-q).filter((v,k,a)=>!k||v-a[k-1]>1e-6);
  const ny=Math.max(1,Math.round((y1-y0)/0.1)), nx=xs.length-1;
  const g=new THREE.BoxGeometry(1,1,1,nx,ny,1).toNonIndexed(), P=g.attributes.position.array;
  for(let i=0;i<P.length;i+=3){ const k=Math.round((P[i]+0.5)*nx); P[i]=xs[k]; P[i+1]=y0+(P[i+1]+0.5)*(y1-y0); P[i+2]=z0+(P[i+2]+0.5)*(z1-z0); }
  return g;
}
// La stoffa: uno o più pannelli UNITI in una sola forma (un pezzo solo, che si piega tutto insieme).
// pannelli: [{x0,x1,y0,y1,z0,z1,lato}] — lato «davanti» o «dietro» dice dove sta la gamba (per il collaudo)
function tessuto(pannelli,colore){
  const pezzi=pannelli.map(p=>pannello(p.x0,p.x1,p.y0,p.y1,p.z0,p.z1)), n=pezzi.reduce((t,g)=>t+g.attributes.position.count,0);
  const pos=new Float32Array(n*3); let o=0; pezzi.forEach(g=>{ pos.set(g.attributes.position.array,o); o+=g.attributes.position.array.length; g.dispose(); });
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.BufferAttribute(pos,3)); geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,mat(colore)); m.userData.tessuto={riposo:pos.slice(),pannelli}; return m;
}
// Piega la stoffa con le gambe, come un tessuto (JJ, 3/10: «un grembiule si piega dove si piega la gamba,
// idem per il camice: se muovo la gamba destra in avanti e la sinistra indietro, un lato va avanti, l'altro va
// indietro, e il tessuto in mezzo segue entrambi i movimenti»). Ogni punto sotto l'anca gira attorno all'anca come
// la gamba del suo lato, davanti e dietro insieme. Sopra ciascuna gamba il giro è PIENO (così la gamba resta
// dentro); solo nella striscia fra le due gambe (|x| < 6 cm) passa morbido dall'una all'altra, e lì la stoffa
// si tende. Sotto l'anca il giro cresce con la distanza dall'anca, pieno a 20 cm.
const PONTE=0.06;
// dove va un punto di stoffa (x, y, z a riposo) con la gamba sinistra a aS e la destra a aD: [y, z]
function deforma(x,y,z,aS,aD){
  if(y>=ANCA) return [y,z];
  let t=Math.min(1,Math.max(0,(x+PONTE)/(2*PONTE))); t=t*t*(3-2*t);
  const giu=Math.min(1,(ANCA-y)/0.2), a=giu*((1-t)*aS+t*aD), dy=y-ANCA, c=Math.cos(a), s=Math.sin(a);
  return [ANCA+dy*c-z*s, dy*s+z*c];
}
function pieghe(av){
  const u=av.userData; if(!u.tessuti||!u.tessuti.length) return;
  const aS=u.gambe[0].rotation.x, aD=u.gambe[1].rotation.x;   // gambe[0] è a sinistra (x<0)
  for(const m of u.tessuti){
    const P=m.geometry.attributes.position, A=P.array, R=m.userData.tessuto.riposo;
    for(let i=0;i<A.length;i+=3){ const [y,z]=deforma(R[i],R[i+1],R[i+2],aS,aD); A[i+1]=y; A[i+2]=z; }
    P.needsUpdate=true; m.geometry.computeVertexNormals(); m.geometry.computeBoundingSphere();
  }
}
function cammina(av, passo){
  const u=av.userData; u.fase+=passo; const a=Math.sin(u.fase)*0.6*Math.min(1,passo*20);
  u.gambe[0].rotation.x=a; u.gambe[1].rotation.x=-a;
  if(!u.ferme){ u.braccia[0].rotation.x=-a*0.8; if(!u.alzato) u.braccia[1].rotation.x=a*0.8; }
  pieghe(av);
}
function fermo(av){ const u=av.userData; u.gambe.forEach(g=>g.rotation.x*=0.8); if(!u.ferme){ u.braccia[0].rotation.x*=0.8; if(!u.alzato) u.braccia[1].rotation.x*=0.8; } pieghe(av); }

const INSEGNE=new Map();
function insegna(titolo, sotto, larghezza, colore="#CAF0F8"){

  x.strokeStyle="#0D3A5C"; x.lineWidth=6; x.strokeRect(3,3,W-6,H-6);
  x.strokeStyle="#00B4D8"; x.lineWidth=8; x.beginPath(); x.moveTo(4,60); x.lineTo(4,4); x.lineTo(60,4); x.moveTo(W-4,H-60); x.lineTo(W-4,H-4); x.lineTo(W-60,H-4); x.stroke();

  x.textAlign="center"; x.textBaseline="middle"; x.fillStyle=colore; x.shadowColor="#00B4D8"; x.shadowBlur=18;

    x.fillStyle="#48CAE4"; x.fillText(sotto, W/2, H*0.78); }
  const materiale=new THREE.MeshBasicMaterial({map:tex(c)}); INSEGNE.set(chiave, materiale);
  return new THREE.Mesh(new THREE.PlaneGeometry(larghezza, larghezza/4), materiale);
}
function facciata(w,h,{muro="#c9b9a0",porta=false,vetrine=0,serranda=false,vetro=false,luce=0.7,seme=1}){
  const k=24, cw=Math.max(16,Math.round(w*k)), ch=Math.max(16,Math.round(h*k));
  const c=tela(cw,ch), e=tela(cw,ch), x=c.getContext("2d"), y=e.getContext("2d");
  let s=seme*9301; const rnd=()=>((s=(s*9301+49297)%233280)/233280);
  x.fillStyle=muro; x.fillRect(0,0,cw,ch); y.fillStyle="#000"; y.fillRect(0,0,cw,ch);
  x.fillStyle="rgba(0,0,0,.08)"; for(let r=0;r<ch;r+=12) x.fillRect(0,r,cw,1);
  x.fillStyle="rgba(0,0,0,.25)"; x.fillRect(0,ch-0.5*k,cw,0.5*k);
  const fin=(fx,fy,fw,fh,acc,col)=>{ x.fillStyle=acc?(col||"#ffe2a8"):"#0b1a2a"; x.fillRect(fx,fy,fw,fh);
    x.strokeStyle="rgba(0,0,0,.45)"; x.lineWidth=2; x.strokeRect(fx,fy,fw,fh);
    if(acc){ y.fillStyle=col||"#ffd9a0"; y.fillRect(fx+2,fy+2,fw-4,fh-4); } };
  if(vetro){ for(let px=0.4*k;px<cw-0.4*k;px+=1.6*k){ fin(px,0.7*k,1.3*k,ch-1.3*k,true,"#9fe9ff"); } return {map:tex(c),emi:tex(e)}; }
  const piani=Math.max(1,Math.floor(h/3));
  const colonne=Math.max(1,Math.floor(w/2.4));
  const passo=cw/colonne;
  for(let p=0;p<piani;p++){
    if(p===0 && (porta||vetrine||serranda)) continue;
    const fy=ch-(p*3+1.0)*k-1.5*k;
    for(let cI=0;cI<colonne;cI++) fin(cI*passo+passo/2-0.55*k, fy, 1.1*k, 1.5*k, rnd()<luce);
  }
  if(serranda){ const sw=Math.min(cw-2*k,5.5*k), sx=(cw-sw)/2, sh=3.4*k;
    x.fillStyle="#7d8794"; x.fillRect(sx,ch-sh,sw,sh); x.fillStyle="rgba(0,0,0,.25)"; for(let r=ch-sh;r<ch;r+=6) x.fillRect(sx,r,sw,2);
    y.strokeStyle="#00B4D8"; y.lineWidth=4; y.strokeRect(sx-2,ch-sh-2,sw+4,sh+4); }
  if(vetrine){ const vw=2.6*k, vh=2.1*k;
    for(const lato of [-1,1]) for(let i=0;i<vetrine;i++){ const vx=cw/2+lato*(1.6*k+i*(vw+0.4*k))-(lato<0?vw:0); fin(vx,ch-vh-0.6*k,vw,vh,true,"#fff1c9"); } }
  if(porta){ const pw=1.8*k, ph=2.6*k, px=(cw-pw)/2; x.fillStyle="#06121f"; x.fillRect(px,ch-ph,pw,ph);
    y.strokeStyle="#00B4D8"; y.lineWidth=5; y.strokeRect(px,ch-ph,pw,ph); x.strokeStyle="#00B4D8"; x.lineWidth=5; x.strokeRect(px,ch-ph,pw,ph);
    y.fillStyle="#0a3550"; y.fillRect(px+4,ch-ph+4,pw-8,ph-8); }
  return {map:tex(c),emi:tex(e)};
}

// tanti rettangoli piatti in un disegno solo (le strade): [cx, cz, largo, lungo, angolo]
function rettangoli(lista, y, colore, emi){
  const pos=[];
  for(const [cx,cz,w,l,a=0] of lista){ const c=Math.cos(a), s=Math.sin(a);
    const P=(lx,lz)=>[cx+lx*c+lz*s, y, cz-lx*s+lz*c];
    const A=P(-w/2,-l/2),B=P(w/2,-l/2),C=P(w/2,l/2),D=P(-w/2,l/2);
    pos.push(...A,...B,...C, ...A,...C,...D); }
  const g=new THREE.BufferGeometry(); g.setAttribute("position",new THREE.Float32BufferAttribute(pos,3)); g.computeVertexNormals();
  return new THREE.Mesh(g, emi? new THREE.MeshBasicMaterial({color:colore,side:THREE.DoubleSide}) : new THREE.MeshLambertMaterial({color:colore,side:THREE.DoubleSide}));
}

    if(!cartaAperta && (Math.abs(mx)>0.05||Math.abs(my)>0.05)){ const l=Math.hypot(vx,vz); vel=andatura(Math.min(1,l))[3]; vx/=l; vz/=l; dentro.meta=null; }
    else if(!cartaAperta && dentro.meta){ const r=versoTappa(tuStanza,dentro,dt,4.2,()=>{ const c=R.cose[dentro.metaId]; tuStanza.rotation.y=Math.atan2(c.x-tuStanza.position.x,c.z-tuStanza.position.z); apriCosa(dentro.metaId); });
      if(r){ [vx,vz,vel]=r; const ya=Math.atan2(-vx,-vz); let dy=ya-stato.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); stato.yaw+=dy*Math.min(1,dt*2.5); } }
    if(vel>0){ tuStanza.position.x+=vx*vel*dt; tuStanza.position.z+=vz*vel*dt; spingiDentro(tuStanza.position,0.4);
      const ry=Math.atan2(vx,vz); let dr=ry-tuStanza.rotation.y; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); tuStanza.rotation.y+=dr*Math.min(1,dt*12); cammina(tuStanza,vel*dt*1.9); }
    else fermo(tuStanza);
    // vicino a una cosa, o alla porta?
    let uso=null; const p=tuStanza.position;
    if(p.z>PROFONDO/2-1.5 && Math.abs(p.x)<1.6) uso="esci";
    else { let dm=1.6; for(const c of Object.values(R.cose)){ const d=Math.hypot(c.posto.x-p.x,c.posto.z-p.z); if(d<dm){ dm=d; uso=c.id; } } }
    if(cartaAperta) uso=null;
    if(uso!==usoPrima){ usoPrima=uso; const b=$("entra"); delete b.dataset.cosa; delete b.dataset.azione; delete b.dataset.id;
      if(uso==="esci"){ b.dataset.azione="esci"; b.textContent="Esci · in città"; b.hidden=false; }
      else if(uso){ b.dataset.cosa=uso; b.textContent="Usa · "+R.cose[uso].nome; b.hidden=false; } else b.hidden=true; }
    // la telecamera: dietro di te; allo specchio, davanti
    camStanza.fov=specchio?60:72; camStanza.aspect=W/H;
    if(cartaAperta) camStanza.setViewOffset(W,H,0,0.34*H,W,H); else camStanza.clearViewOffset();
    camStanza.updateProjectionMatrix();
    if(specchio){ const a=Math.sin(tStanza*0.5)*0.35; ideale.set(p.x+Math.cos(a)*4.2,1.5,p.z+Math.sin(a)*4.2); camStanza.position.lerp(ideale,Math.min(1,dt*4));
      tuStanza.rotation.y=Math.PI/2+Math.sin(tStanza*0.7)*0.6; camStanza.lookAt(p.x,1.1,p.z); }
    else { // dietro e un po' sopra, e lo sguardo va avanti nella stanza, non sui piedi: si vedono le cose
      const pt=0.36, cp=Math.cos(pt); ideale.set(p.x+Math.sin(stato.yaw)*cp*3.4, 1.4+Math.sin(pt)*3.4, p.z+Math.cos(stato.yaw)*cp*3.4);
      ideale.x=Math.max(-LARGO/2+0.25,Math.min(LARGO/2-0.25,ideale.x)); ideale.z=Math.max(-PROFONDO/2+0.25,Math.min(PROFONDO/2-0.25,ideale.z)); ideale.y=Math.min(ALTO-0.3,ideale.y);
      camStanza.position.lerp(ideale,dentro.camSubito?1:Math.min(1,dt*8)); dentro.camSubito=false;
      camStanza.lookAt(p.x-Math.sin(stato.yaw)*2.6,1.2,p.z-Math.cos(stato.yaw)*2.6); }
    R.S.traverse(o=>{ if(o.userData.gira) o.rotation.y+=dt*0.4; });
    R.segni.forEach((s,i)=>{ s.rotation.y+=dt*1.5; s.position.y=Object.values(R.cose)[i].y+Math.sin(tStanza*2+i)*0.08; });
    renderer.render(R.S,camStanza);
  }

  function passo(){
    const dt=Math.min(orologio.getDelta(),0.2), t=orologio.elapsedTime; // anche a pochi fotogrammi si cammina alla velocità giusta
    if(attiva && !attiva.esterno){ passoDentro(dt); return; }
    if(attiva){ tStanza+=dt; const H=innerHeight, W=innerWidth;
      camStanza.fov=70; camStanza.aspect=W/H; camStanza.setViewOffset(W,H,0,0.34*H,W,H); camStanza.updateProjectionMatrix();
      const a=tStanza*0.18; camStanza.position.set(attiva.x+Math.sin(a)*attiva.r, attiva.h, attiva.z+Math.cos(a)*attiva.r); camStanza.lookAt(attiva.x,attiva.y,attiva.z);
      if(scena._globo) scena._globo.rotation.y+=dt*0.35; if(scena._chioma) scena._chioma.rotation.y+=dt*0.04;
      renderer.render(S,camStanza); return; }
    // input
    let [mx,my]=ingresso();
    const fx=-Math.sin(stato.yaw), fz=-Math.cos(stato.yaw);
    let vx=fx*(-my)+(-fz)*mx, vz=fz*(-my)+fx*mx; let vel=0;
    const libero=!fogliAperto || fogliAperto==="vai";
    if((Math.abs(mx)>0.05||Math.abs(my)>0.05) && libero){ const l=Math.hypot(vx,vz); vel=andatura(Math.min(1,l))[2]; vx/=l; vz/=l; stato.meta=null; }
    else if(stato.meta && libero){ const r=versoTappa(tu,stato,dt,7.5,()=>{ const P=porte[stato.metaId]; tu.rotation.y=P.guarda; apriFoglio(P.id); });
      if(r){ [vx,vz,vel]=r; // la telecamera gira dolce dietro a dove vai
        const ya=Math.atan2(-vx,-vz); let dy=ya-stato.yaw; dy=Math.atan2(Math.sin(dy),Math.cos(dy)); stato.yaw+=dy*Math.min(1,dt*2.2); } }
    if(vel>0){ tu.position.x+=vx*vel*dt; tu.position.z+=vz*vel*dt; spingiFuori(tu.position,0.45);
      const ry=Math.atan2(vx,vz); let dr=ry-tu.rotation.y; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); tu.rotation.y+=dr*Math.min(1,dt*12); cammina(tu,vel*dt*1.9); }
    else fermo(tu);

    // chi passeggia
    for(const p of passanti){
      if(!p.meta){ p.attesa-=dt; fermo(p.m); if(p.attesa<=0){ const a=Math.random()*Math.PI*2, r=4+Math.random()*13; p.meta=new THREE.Vector3(Math.sin(a)*r,0,Math.cos(a)*r); } continue; }
      const dx=p.meta.x-p.m.position.x, dz=p.meta.z-p.m.position.z, d=Math.hypot(dx,dz);
      if(d<0.3){ p.meta=null; p.attesa=1+Math.random()*4; continue; }
      p.m.position.x+=dx/d*1.4*dt; p.m.position.z+=dz/d*1.4*dt; spingiFuori(p.m.position,0.4);
      const ry=Math.atan2(dx,dz); let dr=ry-p.m.rotation.y; dr=Math.atan2(Math.sin(dr),Math.cos(dr)); p.m.rotation.y+=dr*Math.min(1,dt*6); cammina(p.m,1.4*dt*1.9);
    }

    // vicino a una porta?
    let vicino=null, dmin=3.3;
    for(const P of Object.values(porte)){ const d=Math.hypot(P.x-tu.position.x,P.z-tu.position.z); if(d<dmin){ dmin=d; vicino=P.id; } }
    if(vicino!==vicinoPrima){ vicinoPrima=vicino; usoPrima=null; const b=$("entra"); delete b.dataset.cosa; delete b.dataset.azione;
      if(vicino && !fogliAperto){ b.dataset.id=vicino; b.textContent=(LUOGHI[vicino].esterno?"Guarda · ":"Entra · ")+LUOGHI[vicino].nome; b.hidden=false; } else b.hidden=true; }
    if(fogliAperto && !$("entra").hidden) $("entra").hidden=true;
    if(!fogliAperto && vicino && $("entra").hidden){ vicinoPrima=null; }

    // la telecamera
    { const cp=Math.cos(stato.pitch); let dist=stato.dist+Math.max(0,stato.pitch-0.6)*26;  // più in alto, più lontano: la città dall'alto
      // trascinando in su la telecamera scende e lo sguardo sale: si vede la cima della torre
      bersaglio.set(tu.position.x,1.6+Math.max(0,0.18-stato.pitch)*95,tu.position.z);
      dir.set(Math.sin(stato.yaw)*cp, Math.sin(stato.pitch), Math.cos(stato.yaw)*cp).normalize();
      const testa=new THREE.Vector3(tu.position.x,1.6,tu.position.z); ray.set(testa,dir); ray.far=dist; const muro=ray.intersectObjects(muri,false); if(muro.length) dist=Math.max(1.2,muro[0].distance-0.4);
      ideale.set(tu.position.x,1.6,tu.position.z).addScaledVector(dir,dist); if(ideale.y<0.5) ideale.y=0.5; ray.far=Infinity; }
    cam.position.lerp(ideale, Math.min(1,dt*9)); cam.lookAt(bersaglio);

    if(scena._globo){ scena._globo.rotation.y+=dt*0.35; scena._globo.position.y=36+Math.sin(t*0.8)*0.4; }
    if(scena._chioma){ scena._chioma.rotation.y+=dt*0.04; }
    if(scena._oro){ const s=1+Math.sin(t*3)*0.18; scena._oro.scale.setScalar(s); }
    renderer.render(S,cam);
  }
  // si disegna solo se la pagina si vede
  let fotogrammi=0;
  renderer.setAnimationLoop(()=>{ if(document.hidden) return; passo(); fotogrammi++; if(fotogrammi===2) $("carica").classList.add("via"); });
  scena.pronta=true; scena.fotogrammi=()=>fotogrammi;
}
let rivesti=()=>{};

costruisci().catch(e=>{ console.error(e); riserva("La città non è riuscita a partire su questo telefono."); });
</script>
